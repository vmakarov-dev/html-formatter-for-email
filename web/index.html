<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>HTML Formatter</title>
<style>
  :root {
    /* Пастельно-графитовая тёмная тема: не чёрный, а тёмно-серый с лёгким
       фиолетовым оттенком (в тон прежней светлой палитре), поверхности
       (card/field) на пару тонов светлее фона — это и даёт ощущение
       глубины без резкого чёрного. */
    --bg: #201f27;
    --card: #2a2933;
    --card-border: #3c3a48;
    --field-bg: #26252e;
    --field-border: #423f4f;
    --text: #e6e2ee;
    --label: #a49dba;
    --accent: #a888ea;
    --accent-hover: #9575da;
    --accent-text: #241a3d;
    --accent-secondary: #7fd1ab;
    --accent-secondary-hover: #6bc098;
    --secondary-text: #113523;
    /* Чисто красные (не розовые!) — раньше были близки по тону к
       .tok-tag (#ec8fc4, розовый), из-за чего "отклонить"/сообщение об
       ошибке визуально путались с обычной подсветкой тегов. Здесь
       синего в оттенке заметно меньше, чем у розового — тон читается
       именно как красный, тревожный. */
    --accent-danger: #d97d7d;
    --accent-danger-hover: #cc6666;
    --danger-text: #3d1212;
    --error: #e2555f;
    --ok-text: #6bdb9e;
    /* Жёлтая пара для "Пустые атрибуты (надо заполнить)" — та же схема,
       что и у status-alert (яркий текст + чуть более приглушённая рамка
       того же тона), просто жёлтая вместо красной: атрибут пустой, но
       это не всегда прямо "ошибка", скорее "требует внимания". */
    --warning-text: #e0be55;
    --accent-warning: #c8a24a;
    /* Тёмно-серая кнопка "Удалить все" у "можно удалить" — нейтральнее
       прежней красной (там это было наравне с "отклонить"/ошибкой, а
       здесь просто рутинное действие без риска). */
    --muted-btn-bg: #55525f;
    --muted-btn-bg-hover: #656270;
    --radius-lg: 18px;
    --radius-sm: 12px;
    /* Номера строк (см. .line-numbers) — заметно тусклее обычного текста
       (--text) и даже --label, читаются, но не отвлекают. */
    --line-number: #5d5a6d;
    /* Заливка отмеченного чекбокса (см. .option-plate input[type=checkbox])
       — та же пастельная гамма, что и .tok-val у подсветки синтаксиса. */
    --checkbox-fill: #7fb0ea;
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
  }
  body {
    display: flex;
    justify-content: center;
    align-items: stretch;
    height: min(100vh, 1200px);
    padding: 3vw 0;
  }
  /* main — CSS grid, а не flex: обеим карточкам ОБЯЗАНЫ совпадать по
     высоте не только целиком, но и ПОСТРОчно — поле ввода/вывода
     (editor/output-wrap) должно быть одной и той же высоты в обеих
     карточках, а кнопки "Форматировать"/"Скопировать" — стоять на одном
     уровне, хотя количество и высота контента НИЖЕ кнопки в двух
     карточках разные (options-row — три ряда чекбоксов, status-plates-row
     — одна строка, которая к тому же то пустая, то нет). flex с
     независимыми колонками так не умеет: каждая карточка сама решала бы,
     сколько места оставить editor'у, исходя из СВОЕГО собственного
     контента снизу. Grid-строки же общие на весь main — 1fr у editor-
     строки (row 2) и auto у footer-строки (row 3) считаются ОДИН раз для
     обеих колонок сразу. */
  main {
    display: grid;
    grid-template-columns: 2fr 3fr;
    grid-template-rows: auto 1fr auto auto;
    gap: 24px;
    width: 94vw;
    min-height: 0;
  }
  .card {
    /* Каждая карточка — сама тоже grid, subgrid по строкам: её 4 прямых
       ребёнка (card-label/editor.output-wrap/card-footer/options-row·
       status-plates-row) занимают ровно те же 4 строки, что заданы у
       main — тогда их высоты берутся из ОБЩИХ (shared) grid-треков, а не
       считаются отдельно для каждой колонки. */
    grid-row: 1 / span 4;
    display: grid;
    grid-template-rows: subgrid;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-lg);
    padding: 20px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.28);
    min-height: 0;
    /* Без этого длинная нерazrывная строка внутри #output (например,
       атрибут со здоровенным href) раздувает .card вширь вместо того,
       чтобы включился внутренний горизонтальный скролл у #output — сам
       #output уже умеет схлопываться (min-width:0 ниже), но только если
       её родители по цепочке контейнеров (main → .card → .output-wrap)
       тоже могут сжаться меньше content-based ширины. */
    min-width: 0;
  }
  /* 40/60 вместо равных половин — окно ввода поменьше, вывода побольше
     (см. grid-template-columns: 2fr 3fr у main выше). */
  .card-input { grid-column: 1; }
  .card-output { grid-column: 2; }
  .card-label {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 12px;
    margin-bottom: 12px;
  }
  .card-label span {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--label);
  }
  /* Сводки под кнопкой "Скопировать" (см. updateOutputStatus/
     updateEmptyAttrsStatus в скрипте) — сейчас их может быть до двух в
     ряд (незакрытые/лишние теги и, отдельно, пустые атрибуты), поэтому
     margin-top живёт на самом РЯДУ, а не на отдельных плашках. :has() —
     чтобы не тащить пустой отступ, когда обе плашки пустые (ничего не
     нашли/проверки выключены). Значение то же самое, что и у отступа
     чекбоксов от "Форматировать" (.options-row ниже) — два симметричных
     "второй ряд под главной кнопкой", отступ у них обязан совпадать. */
  .status-plates-row {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    gap: 10px;
  }
  .status-plates-row:has(.status-plate:not(:empty)) {
    margin-top: 24px;
  }
  /* В стиле тех же плашек-чекбоксов слева (.option-plate) — единый
     визуальный язык для "второстепенной строки под основным действием"
     на обеих карточках. */
  .status-plate {
    width: fit-content;
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    font-size: 12.5px;
    font-weight: 600;
    background: var(--field-bg);
    border: 1px solid var(--field-border);
  }
  /* display:none, а не просто обнуление padding/border — .status-plates-row
     это flex-ряд с gap, и даже визуально схлопнутый (padding:0;border:none)
     пустой элемент всё равно СЧИТАЕТСЯ отдельным flex-item: gap между ним
     и соседней плашкой всё равно вставлялся бы, и следующая плашка
     оказывалась бы сдвинута от левого края на этот gap, хотя выглядит,
     будто первой плашки нет вовсе. */
  .status-plate:empty {
    display: none;
  }
  .status-plate.status-alert { color: var(--error); border-color: var(--accent-danger); }
  .status-plate.status-ok { color: var(--ok-text); border-color: var(--accent-secondary); }
  .status-plate.status-warning { color: var(--warning-text); border-color: var(--accent-warning); }
  /* "Можно удалить" — серая, не тревожная: в отличие от "надо заполнить"
     (та использует status-alert, красная) или незакрытых/лишних тегов,
     эта категория не требует решения человека — атрибут просто лишний,
     удалить его можно одной кнопкой без риска. */
  .status-plate.status-muted { color: var(--label); border-color: var(--field-border); }
  /* Плашка "Пустые атрибуты (...):"  — заголовок жирным (как остальные
     плашки), список ниже уже обычным начертанием и мельче, чтобы не
     спорить по весу с заголовком. */
  .empty-attrs-title { font-weight: 600; }
  .empty-attrs-list {
    margin: 4px 0 0;
    padding-left: 16px;
    font-weight: 400;
    font-size: 11.5px;
  }
  .empty-attrs-list li { margin-top: 2px; }
  /* Номер строки в списке пустых атрибутов — кликабелен (см.
     handleEmptyAttrLineClick в скрипте): скроллит #output к этой строке
     и дважды мигает красным сам найденный атрибут прямо в коде. */
  .empty-attrs-line-link {
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .empty-attrs-line-link:hover { color: var(--accent); }
  .empty-attrs-delete-all {
    display: block;
    margin: 8px 0 0;
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    background: var(--muted-btn-bg);
    color: var(--text);
    border: none;
    cursor: pointer;
  }
  .empty-attrs-delete-all:hover { background: var(--muted-btn-bg-hover); }
  .editor, .output-wrap {
    /* flex:1 больше не нужен — .card теперь grid (см. выше), и своей
       строки (1fr, row 2) эти два элемента заполняют просто по умолчанию
       (обычное поведение grid-элементов — растягиваться на всю клетку). */
    min-height: 440px;
    min-width: 0;
  }
  /* .output-wrap сам НЕ обрезает своё содержимое (overflow:visible) —
     подсказки о флажках за пределами видимой области (.scroll-hint, см.
     ниже) должны уметь высовываться левее .output-clip, в поле карточки.
     Обрезка нужна только внутренним слоям (попапы/линия при
     горизонтальном скролле) — за неё отвечает .output-clip. */
  .output-wrap { position: relative; }
  /* Раньше overflow:hidden стоял прямо на .output-wrap — сюда его
     перенесли, когда понадобилось, чтобы .scroll-hint (вне этого клипа)
     мог вылезать в поле карточки слева. Всё остальное содержимое
     (номера строк, попапы, линия-граница, сам текст) — здесь, внутри
     клипа, обрезается по границе видимой области карточки: попап
     "Добавить?" (см. .suggest-popup) и линия-указатель до тега (см.
     .popup-connectors) обрезаются по ней, если тег прокручен
     горизонтальным скроллом #output за пределы видимого окна, вместо
     того чтобы "уезжать" поверх соседних карточек. Слева попап при этом
     никогда не должен упираться в границу сам по себе (без скролла) —
     за это отвечает выбор стороны в choosePopupSide (переставляет попап
     направо, если слева не хватает места), так что обрезка здесь —
     просто страховка на случай скролла, а не основной механизм
     позиционирования. */
  .output-clip {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }
  /* Подсказка "ближайший флажок сейчас за пределами экрана" (см.
     updateScrollHints в скрипте) — сама плашка живёт СНАРУЖИ .output-clip
     (поэтому не обрезается его overflow:hidden), в поле карточки слева
     от колонки номеров: у .card padding 20px, left:-18px оставляет
     здесь и сверху ~2px до собственной границы карточки. top/bottom —
     "почти у самого верха/низа" видимой области. display:none по
     умолчанию — показывается (.visible) только когда есть хоть один
     флажок в соответствующую сторону от текущей прокрутки. */
  .scroll-hint {
    position: absolute;
    left: -18px;
    width: 16px;
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 1px;
    line-height: 1;
    cursor: pointer;
    pointer-events: auto;
    z-index: 5;
  }
  .scroll-hint.visible { display: flex; }
  .scroll-hint-up { top: 8px; }
  .scroll-hint-down { bottom: 8px; }
  .scroll-hint .arrow { color: var(--line-number); font-size: 10px; }
  /* Номера строк — общий слой и для #input (в паре с #inputHighlight), и
     для #output: одна и та же колонка фиксированной ширины (под 4 цифры,
     этого с запасом хватает и на многотысячные письма), текст справа с
     небольшим отступом до того, что идёт дальше (сам текст). Отдельного
     гаттера под флажки больше нет — на строке, где раньше стоял бы
     флажок, теперь ПРЯМО ВМЕСТО номера строки печатается сам флаг (см.
     .line-flag и renderOutputLineNumbers в скрипте) — своя колонка
     флажкам, отдельная от номеров, только отнимала место и заставляла
     взгляд бегать между двумя соседними столбцами.
     Собственный вертикальный скролл (scrollTop выставляется в JS —
     см. syncInputScroll/output.addEventListener("scroll", ...)) — так
     колонка едет вместе с содержимым по вертикали, а не скроллится сама
     по горизонтали (overflow:hidden — скроллбар не нужен, он и не будет
     виден, scrollTop работает и без него). */
  .line-numbers {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    /* +8px, не +6px: на трёхзначных номерах строк (сотни строк — обычное
       дело в реальных письмах) 6px оставляли слишком мало воздуха слева
       от цифр, у самого края карточки. padding-right остаётся 6px —
       добавленные 2px уходят в левый запас (текст в колонке прижат
       вправо, text-align:right). */
    width: calc(4ch + 8px);
    /* Низ — 0, синхронно с .editor-highlight/.editor-textarea/
       .output-editor/pre (см. там же): это ОДНИ И ТЕ ЖЕ по высоте
       синхронизируемые слои (см. syncInputScroll/setOutputScrollTop) —
       если бы здесь остался старый нижний padding (16px), а у текста стал
       0, их scrollHeight разошлись бы ровно на эти 16px, и вернулся бы
       тот самый рассинхрон скролла, который чинили этой сессией. */
    padding: 16px 6px 0 0;
    margin: 0;
    overflow: hidden;
    /* Непрозрачный фон обязателен: сама колонка НЕ скроллится (стоит на
       фиксированном месте экрана), а вот padding-left у #output/textarea
       — часть их СОБСТВЕННОГО прокручиваемого содержимого и при
       горизонтальном скролле уезжает вместе с текстом (стандартное
       поведение overflow:auto — начальный отступ элемента "укатывается"
       при скролле точно так же, как и сам контент). Без своего фона
       здесь просвечивал бы уехавший под колонку текст. */
    background: var(--field-bg);
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 1.6;
    text-align: right;
    color: var(--line-number);
    white-space: pre;
    pointer-events: none;
    user-select: none;
    /* Выше .editor-highlight (z-index:1) — у него непрозрачный фон
       (--field-bg) и он тоже position:absolute, так что при равном/
       отсутствующем z-index он рисовался бы ПОВЕРХ номеров строк
       независимо от порядка в DOM, полностью их закрывая. */
    z-index: 3;
  }
  /* Флажок ВМЕСТО номера строки (см. renderOutputLineNumbers) — та же
     ширина колонки и то же text-align:right, что и у цифр, просто
     кликабелен (у контейнера .line-numbers pointer-events:none, здесь
     явно возвращаем auto). Красный ("open") — сам незакрытый/лишний тег
     (row = его настоящая строка); серый ("close", класс ниже) — на
     строке предполагаемой вставки (пока подсказка ещё не решена — см.
     .suggest-popup). Клик по любому скроллит к парному через uid (см.
     renderOutputLineNumbers). */
  .line-flag {
    cursor: pointer;
    pointer-events: auto;
  }
  /* Серый флажок — тот же самый флаг-эмодзи, что и красный (одинаковый
     размер гарантирован самим совпадением глифа), просто обесцвеченный
     фильтром — а не другой, более мелкий символ. */
  .line-flag-close { filter: grayscale(1) brightness(1.3); }
  /* Отдельный оверлей-слой для попапов "Добавить?" (см. .suggest-popup) —
     позиционируется по реальным координатам в DOM и может выступать
     левее колонки номеров. */
  .output-popups {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  /* === НАЧАЛО: изолированный блок "умного" позиционирования попапов
     (см. positionSuggestPopups в скрипте — там же подробности и как
     откатить). .popup-connectors — SVG-слой с линиями-указателями от
     попапа к реальной точке на теге: рисуется поверх .output-popups,
     тоже не блокирует клики (pointer-events:none).
     z-index обязателен, а не auto: у #output есть свой transform
     (см. .line-numbers, .editor-highlight, #output { transform:
     translateZ(0) } выше, GPU-слой под фикс "резиновой" перекрутки) —
     transform сам по себе создаёт для #output стековый контекст уровня
     0, и без явного z-index здесь эта SVG (тоже z-index:auto) красится
     в ТОМ ЖЕ уровне, что и #output, проигрывая ему порядок отрисовки
     просто потому, что #output идёт в разметке позже. Явный z-index
     поднимает линию в заведомо более высокий слой, независимо от
     transform-слоёв соседей. */
  .popup-connectors {
    position: absolute;
    inset: 0;
    overflow: visible;
    pointer-events: none;
    z-index: 3;
  }
  /* Светлее, чем сам .tok-tag (#ec8fc4) — линия должна читаться как
     "в цвет тега", но не спорить с ним по яркости. */
  .popup-connectors line {
    stroke: #f2b8dc;
    stroke-width: 1.5;
  }
  .popup-connectors circle {
    fill: #f2b8dc;
  }
  /* === КОНЕЦ блока стилей "умного" позиционирования === */
  /* Всплывающая плашка с вопросом "Добавить?" перед предполагаемым
     закрывающим тегом. left/top в px выставляются в JS
     (positionSuggestPopups) уже готовыми, с учётом реальной ширины
     плашки — никакого translate() для смещения не нужно. */
  /* Светлый фон нарочно — попап должен выделяться контрастным пятном на
     тёмном фоне карточки, а не сливаться с ней (как было раньше при
     background: var(--card)). Текст — тёмный, под светлую заливку. */
  /* flex-direction:column — попап теперь может состоять из ДВУХ строк:
     основной (вопрос + кнопки, см. .suggest-popup-main) и, если у записи
     есть пара (см. pairId в src/formatter.ts), ещё одной, мельче и
     тусклее, со строкой парного тега (см. .suggest-popup-pair). Радиус
     раньше был 999px (полная "таблетка") — на двух строках это выглядело
     бы растянутой овальной формой, поэтому радиус тот же, что и у
     остальных плашек в интерфейсе (.option-plate/.status-plate). */
  .suggest-popup {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 2px;
    padding: 3px 8px;
    background: #f3f0fa;
    border: 1px solid #d9d3ea;
    border-radius: var(--radius-sm);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    font-size: 12px;
    color: #2a2933;
    white-space: nowrap;
    pointer-events: auto;
    z-index: 4;
  }
  .suggest-popup-main {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .suggest-popup-pair {
    font-size: 10px;
    color: #86809a;
  }
  /* Номер строки в "Парный тег: N" — кликабелен (см. renderPopups): просто
     скроллит к этой строке (scrollRowIntoView), в отличие от такой же на
     вид ссылки в плашке пустых атрибутов — здесь ничего не мигает, сам
     парный тег и так уже подсвечен своим флажком в колонке номеров. */
  .suggest-popup-pair-link {
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .suggest-popup-pair-link:hover { color: #2a2933; }
  .suggest-popup button {
    all: unset;
    box-sizing: border-box;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    font-size: 10px;
    line-height: 1;
  }
  .suggest-popup .accept { background: var(--accent-secondary); color: var(--secondary-text); }
  .suggest-popup .accept:hover { background: var(--accent-secondary-hover); }
  .suggest-popup .reject { background: var(--accent-danger); color: var(--danger-text); }
  .suggest-popup .reject:hover { background: var(--accent-danger-hover); }
  /* Пока в выводе есть хоть один неразрешённый тег (см.
     updateOutputEditableState в скрипте) — редактирование #outputEditor
     запрещено целиком: "призрачные" строки-подсказки (см. .suggested-line/
     buildDisplayHtml) физически не существуют в его собственном value,
     и правка вперемешку с ними ломает и разметку, и синхронизацию скролла
     (см. соседние правки этой сессии). Курсор — тот же "запрещающий" знак,
     что и у обычных disabled-элементов. */
  .output-editor.locked { cursor: not-allowed; }
  /* Подсказка "Обязательно сбалансируйте теги" — тот же визуальный язык,
     что и .suggest-popup (см. showLockedTooltip), просто без кнопок,
     появляется у места клика и гаснет сама через 3 секунды. */
  .locked-tooltip {
    position: absolute;
    display: none;
    padding: 6px 12px;
    background: #f3f0fa;
    border: 1px solid #d9d3ea;
    border-radius: var(--radius-sm);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    font-size: 12px;
    color: #2a2933;
    white-space: nowrap;
    pointer-events: none;
    z-index: 6;
  }
  .locked-tooltip.visible { display: block; }
  /* padding-left = (4ch + 8px) под номера строк (в них же теперь и
     флажки, см. .line-flag выше) + 6px небольшого зазора до текста.
     paddingLeft читается в JS через getComputedStyle, так что calc() с
     ch здесь безопасен — к моменту чтения браузер уже посчитал итоговые
     px. */
  /* height:100% вместо прежнего flex:1 — .output-wrap больше не флекс-
     контейнер (см. комментарий выше про .output-clip), так что высоту
     нужно взять явно от родителя, иначе #output разрастается по высоте
     контента целиком вместо того, чтобы скроллиться внутри своих 100%. */
  #output {
    display: block;
    width: 100%;
    height: 100%;
    min-width: 0;
    padding-left: calc(4ch + 8px + 6px);
  }
  /* Строка-подсказка с предполагаемым закрывающим тегом: серый текст,
     без какой-либо рамки/линии (раньше была пунктирная — убрали совсем,
     см. .suggest-popup вместо неё). display НЕ трогаем (обычный inline,
     как и остальные токены подсветки) — display:block здесь заставлял
     браузер добавлять свой собственный перенос строки ДОПОЛНИТЕЛЬНО к
     "\n"-символу между строками (см. resultLines.join("\n") в скрипте),
     отсюда и был лишний пустой отступ под каждой такой строкой. Эта
     строка есть только в ОТОБРАЖЕНИИ, пока пользователь не подтвердит её
     в попапе — в lastCleanHtml (то, что копирует кнопка "Скопировать")
     её нет, пока не нажали "✓" (см. acceptSuggestion в скрипте). */
  .suggested-line {
    color: var(--label);
  }
  /* Само поле ввода — это на самом деле два наложенных друг на друга
     элемента: снизу <pre> с подсветкой (см. #inputHighlight), сверху —
     настоящий <textarea> с прозрачным текстом (виден только курсор), где
     реально происходит ввод/выделение/копирование. Обычный <textarea>
     не умеет красить текст внутри себя, а contenteditable-трюки гораздо
     капризнее в вёрстке и плохо работают с undo/paste — этот приём проще
     и надёжнее. */
  .editor { position: relative; }
  .editor-highlight,
  .editor-textarea,
  .output-editor,
  pre {
    margin: 0;
    /* Низ — 0, не 16px, как у остальных сторон (см. запрос пользователя).
       #outputEditor поверх этого при необходимости (см. renderOutput —
       есть непринятая серая строка-подсказка) всё ещё выставляет свой
       собственный inline padding-bottom (26px) — это не конфликтует: он
       побеждает как более специфичный (inline) и не завязан на это
       базовое значение здесь. */
    padding: 16px 16px 0;
    border: 1px solid var(--field-border);
    border-radius: var(--radius-sm);
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 1.6;
    tab-size: 2;
    white-space: pre;
    overflow: auto;
    /* Без этого редактируемый (не readOnly) textarea у границы скролла
       иногда запускает "резиновую" сверхпрокрутку (overscroll bounce) —
       на мгновение уезжает НИЖЕ реального максимума и отскакивает
       обратно, а во время анимации у соседних (жёстко синхронизированных
       по scrollTop, см. syncInputScroll/setOutputScrollTop) слоёв номеров
       строк/подсветки на глаз "съезжает" разметка. readOnly-поле этот
       эффект почему-то не запускает вовсе (отсюда и разница в поведении
       при включённой/выключенной проверке тегов — см. историю в чате) —
       но раз сам эффект лишний в любом случае (эти поля и так никогда не
       скроллятся дальше своего реального содержимого), просто выключаем
       его явно у всех шести синхронизируемых слоёв разом (тут общий
       селектор на все), а не полагаемся на побочный эффект readOnly. */
    overscroll-behavior: contain;
  }
  /* Тёмные скроллбары в тон теме — по умолчанию Chrome/Safari рисуют
     светлые (почти белые) полосы, которые на тёмном фоне сильно
     выделяются. scrollbar-color/-width — стандартный способ (Firefox и
     новые Chrome/Safari), ::-webkit-scrollbar-* — старый, но всё ещё
     нужный для полной поддержки в Safari/Chrome. */
  .editor-textarea,
  .editor-highlight,
  .output-editor,
  pre {
    scrollbar-color: var(--field-border) transparent;
    scrollbar-width: thin;
  }
  .editor-textarea::-webkit-scrollbar,
  .editor-highlight::-webkit-scrollbar,
  .output-editor::-webkit-scrollbar,
  pre::-webkit-scrollbar {
    width: 10px;
    height: 10px;
  }
  .editor-textarea::-webkit-scrollbar-track,
  .editor-highlight::-webkit-scrollbar-track,
  .output-editor::-webkit-scrollbar-track,
  pre::-webkit-scrollbar-track {
    background: transparent;
  }
  .editor-textarea::-webkit-scrollbar-thumb,
  .editor-highlight::-webkit-scrollbar-thumb,
  .output-editor::-webkit-scrollbar-thumb,
  pre::-webkit-scrollbar-thumb {
    background-color: var(--field-border);
    border-radius: 999px;
    border: 2px solid transparent;
    background-clip: padding-box;
  }
  .editor-textarea::-webkit-scrollbar-thumb:hover,
  .editor-highlight::-webkit-scrollbar-thumb:hover,
  .output-editor::-webkit-scrollbar-thumb:hover,
  pre::-webkit-scrollbar-thumb:hover {
    background-color: var(--label);
  }
  .editor-highlight,
  .editor-textarea {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  /* .line-numbers/.editor-highlight/#output объединяет одно: их scrollTop
     выставляется программно из JS (см. syncInputScroll/setOutputScrollTop),
     а не через настоящий пользовательский скролл — а это как раз тот
     случай, когда Chromium иногда НЕ выделяет position:absolute слою
     собственный composited-слой сам по себе, и при частых программных
     scrollTop его ОТРИСОВАННОЕ содержимое может визуально отставать от
     уже обновившегося (корректного!) значения scrollTop — сам layout
     (scrollHeight/scrollTop/clientHeight) при этом остаётся верным, "едет"
     именно нарисованная картинка. Полный принудительный reflow всей
     страницы (например, при открытии DevTools) на время чинит это —
     сильный намёк именно на рассинхрон ОТРИСОВКИ, а не разметки.
     translateZ(0) — классический приём: форсирует у элемента СОБСТВЕННЫЙ
     GPU-слой, после чего браузер обязан честно перерисовывать именно его
     при каждом scrollTop, а не полагаться на слой соседа. */
  .line-numbers, .editor-highlight, #output {
    transform: translateZ(0);
    will-change: transform;
  }
  .editor-highlight {
    background: var(--field-bg);
    color: var(--text);
    pointer-events: none;
    z-index: 1;
    /* Место под номера строк (см. .line-numbers) — тот же расчёт, что и
       у #output ниже, только без гаттера флажков (тут его нет). */
    padding-left: calc(4ch + 8px + 16px);
  }
  .editor-textarea {
    background: transparent;
    color: transparent;
    caret-color: var(--text);
    outline: none;
    resize: none;
    z-index: 2;
    /* Должен точь-в-точь совпадать с padding-left у .editor-highlight —
       это два наложенных друг на друга слоя одного и того же текста. */
    padding-left: calc(4ch + 8px + 16px);
  }
  .editor-textarea::placeholder { color: var(--label); }
  .editor-textarea:focus { border-color: var(--accent); }
  .editor-textarea:focus ~ .editor-highlight { border-color: var(--accent); }
  /* #inputLineNumbers стоит в разметке РАНЬШЕ .editor-textarea, так что
     обычный "~" (только более ПОЗДние соседи) её не достаёт — вместо
     него :has() на общем родителе .editor (симметрично .output-clip у
     вывода, см. ниже). Правую грань (общий с .line-numbers разделитель
     между номерами и кодом) не трогаем — она остаётся тусклой всегда. */
  .editor:has(.editor-textarea:focus) #inputLineNumbers {
    border-top-color: var(--accent);
    border-left-color: var(--accent);
    border-bottom-color: var(--accent);
  }
  /* .line-numbers — тоже <pre> (см. общее правило border у .editor-highlight/
     .editor-textarea/.output-editor/pre выше), так что по умолчанию
     получила бы точно такую же скруглённую рамку по всему периметру, что
     и они — но она стоит ВНУТРИ этой общей рамки, а не вместо неё. Общий
     минимум — тонкая вертикальная черта на месте правой грани колонки
     (граница между номерами и кодом), без скругления; сверху/снизу/слева
     обе — и #inputLineNumbers, и #outputLineNumbers — дополняют её ещё и
     полноценной рамкой (см. правило ниже). */
  .line-numbers {
    border: none;
    border-right: 1px solid var(--field-border);
    border-radius: 0;
  }
  /* Сверху, снизу и слева обе колонки номеров получают рамку (той же
     тусклой var(--field-border)), со скруглением ТОЛЬКО с левой стороны
     (radius: top-left/bottom-left — те же 12px, что у остального поля;
     top-right/bottom-right — 0, там стык с прямой правой гранью-
     разделителем выше). На фокусе своего textarea (см. правила
     .editor-textarea:focus/.output-editor:focus ниже) эти три новые грани
     тоже становятся акцентными — вместе с уже подсвечивающейся рамкой
     textarea/pre вокруг это читается как одна общая рамка вокруг всего
     поля, просто с прямым, а не скруглённым, внутренним стыком у номеров
     строк. */
  #inputLineNumbers, #outputLineNumbers {
    border-top: 1px solid var(--field-border);
    border-bottom: 1px solid var(--field-border);
    border-left: 1px solid var(--field-border);
    border-radius: var(--radius-sm) 0 0 var(--radius-sm);
  }
  /* Поле вывода теперь тоже редактируемое — тот же приём "прозрачный
     textarea поверх подсвеченного <pre>", что и у ввода (см. .editor
     выше): реальный ввод/курсор/выделение — в этом textarea, видимый
     подсвеченный текст — в #output под ним. В отличие от ввода, тут ещё
     и номера строк (в них же теперь и флажки)/попапы — они должны
     оставаться КЛИКАБЕЛЬНЫМИ поверх этого поля (см. z-index:3 у
     .line-numbers и z-index:4 у .output-popups — оба выше здешнего 2). */
  .output-editor {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    color: transparent;
    caret-color: var(--text);
    outline: none;
    resize: none;
    z-index: 2;
    /* Совпадает с padding-left у #output ниже — то же самое поле под
       номера строк, что и у подсвеченного слоя под этим textarea. */
    padding-left: calc(4ch + 8px + 6px);
  }
  .output-editor:focus { border-color: var(--accent); }
  .output-editor:focus ~ #output { border-color: var(--accent); }
  /* #outputLineNumbers стоит в разметке РАНЬШЕ .output-editor, так что
     обычный "~" (только более ПОЗДние соседи) её не достаёт — вместо
     него :has() на общем родителе (см. .output-clip). Красим только
     три "свои" стороны (верх/лево/низ) — правую (общий с .line-numbers
     разделитель между номерами и кодом) не трогаем, она остаётся тусклой
     всегда, как и у поля ввода. */
  .output-clip:has(.output-editor:focus) #outputLineNumbers {
    border-top-color: var(--accent);
    border-left-color: var(--accent);
    border-bottom-color: var(--accent);
  }
  pre {
    background: var(--field-bg);
    color: var(--text);
    /* Без переноса строк, с горизонтальным скроллом — как у поля ввода.
       Это принципиально для гаттера с флажками: если длинная строка
       переносится на несколько визуальных, "номер строки × высота
       строки" перестаёт совпадать с реальной позицией на экране, и
       флажки уезжают не туда. */
    white-space: pre;
    outline: none;
  }
  .card-footer {
    margin-top: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  button {
    border: none;
    border-radius: 999px;
    padding: 11px 22px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.05s ease;
  }
  button:active { transform: scale(0.97); }
  .btn-primary { background: var(--accent); color: var(--accent-text); }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-secondary { background: var(--accent-secondary); color: var(--secondary-text); }
  .btn-secondary:hover { background: var(--accent-secondary-hover); }
  /* margin-top совпадает с .status-plates-row (см. комментарий там) —
     тот же отступ "кнопка → второй ряд" на симметричной карточке.
     .options-row — просто обёртка (единственный прямой ребёнок .card на
     этой grid-строке, см. subgrid у .card в CSS выше — менять число
     прямых детей .card нельзя, не сломав совпадение строк с соседней
     карточкой), сам ряд чекбоксов и разворачиваемый "дополнительный" ряд
     — уже внутри неё, двумя отдельными классами. */
  .options-row {
    margin-top: 24px;
  }
  .options-row-main,
  .options-row-advanced {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  /* [hidden] и .options-row-advanced{display:flex} — оба селектора
     специфичностью 0-1-0, а автор (эта таблица стилей) идёт в каскаде
     ПОЗЖЕ дефолтных стилей браузера (там как раз лежит [hidden]{display:
     none}) — так что без явного правила ниже display:flex просто
     побеждал бы hidden-атрибут, и блок оставался бы виден всегда,
     независимо от него. */
  .options-row-advanced[hidden] { display: none; }
  /* "Дополнительно" — пока прячет только "Сжать комментарии для Outlook"
     (редко нужная опция, не стоит того, чтобы всегда занимать место в
     основном ряду), но задумана как общее место для будущих
     редконужных настроек. margin сверху/снизу СВОЙ, не наследуется от
     .options-row-advanced (у неё margin-top убран ниже) — иначе при
     развороте отступы складывались бы вдвое (кнопка — inline-block, её
     margin с соседом не схлопывается). */
  .advanced-toggle {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin: 18px 0;
    padding: 0;
    background: none;
    border: none;
    color: var(--label);
    font-size: 12px;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .advanced-toggle:hover { color: var(--text); }
  /* Стрелка — тот же приём, что и галочка у чекбокса (.option-plate
     input[type="checkbox"]:checked::after): уголок из двух сторон рамки,
     повёрнутый на 45deg, а не юникод-глиф — чище рисуется и ровно
     совпадает по цвету с текстом ссылки (currentColor). Разворот в
     обратную сторону (открыто/закрыто) — просто другой угол поворота, с
     плавным transition. */
  .advanced-toggle-arrow {
    width: 6px;
    height: 6px;
    border: solid currentColor;
    border-width: 0 1.5px 1.5px 0;
    transform: rotate(45deg);
    transition: transform 0.15s ease;
  }
  .advanced-toggle[aria-expanded="true"] .advanced-toggle-arrow {
    transform: rotate(-135deg);
  }
  /* Каждый чекбокс — своя плашка шириной по содержимому (не растягивается
     и не делится на доли ширины блока); новые чекбоксы просто встают
     рядом и переносятся на следующую строку, если не помещаются. */
  .option-plate {
    width: fit-content;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 14px;
    background: var(--field-bg);
    border: 1px solid var(--field-border);
    border-radius: var(--radius-sm);
    font-size: 12.5px;
    color: var(--label);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  /* Свой чекбокс вместо системного (по умолчанию — резкий синий квадрат с
     крупной галочкой, выбивался из общей приглушённой палитры). Форма —
     скруглённый квадрат в тон остальным элементам (--radius-sm — тот же
     принцип, что и у крупных карточек, просто меньше), заливка при
     отметке — фирменный фиолетовый --accent, галочка — тонкая, из двух
     линий на border (классический CSS-приём), а не эмодзи/юникод-символ
     (тот всегда крупнее и жирнее, чем нужно для такого размера). */
  .option-plate input[type="checkbox"] {
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
    flex: none;
    width: 15px;
    height: 15px;
    margin: 0;
    border-radius: 4px;
    border: 1.5px solid var(--field-border);
    background: var(--field-bg);
    position: relative;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .option-plate input[type="checkbox"]:hover {
    border-color: var(--checkbox-fill);
  }
  .option-plate input[type="checkbox"]:checked {
    /* Пастельно-голубая заливка (не фирменный фиолетовый --accent — тот
       уже занят кнопкой "Форматировать"/рамкой фокуса, чекбоксы должны
       читаться отдельно от них). */
    background: var(--checkbox-fill);
    border-color: var(--checkbox-fill);
  }
  .option-plate input[type="checkbox"]:checked::after {
    content: "";
    position: absolute;
    left: 4px;
    top: 1px;
    width: 4px;
    height: 7px;
    /* Тёмная — на светло-голубой заливке нужен контраст, а не ещё один
       светлый оттенок поверх светлого. */
    border: solid var(--accent-text);
    border-width: 0 1.5px 1.5px 0;
    transform: rotate(45deg);
  }
  #status {
    font-size: 12px;
    color: var(--error);
    min-height: 16px;
    margin-top: 8px;
  }
  /* Подсветка синтаксиса — цвета токенов, подобраны под тёмный фон
     (ярче/светлее исходных, иначе на тёмной поверхности читались бы
     тускло). tok-val и tok-comment намеренно разведены по цвету (синий и
     зелёный), а не два похожих оттенка зелёного, чтобы значения
     атрибутов и комментарии не путались на глаз. tok-tag — розовый, а не
     фиолетовый: прежний оттенок был слишком похож на --accent (рамка при
     фокусе, кнопка "Форматировать") и сливался с ними на глаз. */
  .tok-tag { color: #ec8fc4; }
  .tok-attr { color: #e0ac6f; }
  .tok-val { color: #7fb0ea; }
  .tok-comment { color: #7ecb9c; }
  .tok-doctype { color: #a49dba; }
  /* Клик по номеру строки в списке "Пустые атрибуты" (см.
     handleEmptyAttrLineClick в скрипте) — сам найденный атрибут прямо в
     #output дважды мигает красным фоном. Два цикла по 1с — суммарно 2с. */
  @keyframes empty-attr-flash {
    0%, 100% { background: transparent; color: inherit; }
    25%, 75% { background: rgba(226, 85, 95, 0.45); color: var(--text); }
  }
  .flash-empty-attr {
    animation: empty-attr-flash 1s ease-in-out 2;
    border-radius: 3px;
  }
  /* Условный ("outlook") комментарий целиком — маркеры и всё содержимое
     внутри, включая теги/атрибуты — тем же зелёным, что и обычные
     комментарии (.tok-comment): раньше был отдельный серый, чтобы
     выделить его среди контента, но теперь оба вида комментариев
     красятся одинаково. */
  .tok-outlook-comment { color: #7ecb9c; }
</style>
</head>
<body>
<main>
  <section class="card card-input">
    <div class="card-label">
      <span>Исходный HTML</span>
    </div>
    <div class="editor">
      <pre id="inputLineNumbers" class="line-numbers" aria-hidden="true"></pre>
      <textarea id="input" class="editor-textarea" spellcheck="false" placeholder="Вставьте сюда HTML..."></textarea>
      <pre id="inputHighlight" class="editor-highlight" aria-hidden="true"></pre>
    </div>
    <div class="card-footer">
      <button id="formatBtn" class="btn-primary" type="button">Форматировать</button>
    </div>
    <div class="options-row">
      <div class="options-row-main">
        <label class="option-plate">
          <input type="checkbox" id="typografy" checked>
          Типограф
        </label>
        <label class="option-plate" title="Ищет и незакрытые теги, и теги, перед которыми пропущен единственно возможный родитель (например, <td> без <tr>)">
          <input type="checkbox" id="checkUnclosedTags" checked>
          Проверить целостность тегов
        </label>
        <label class="option-plate">
          <input type="checkbox" id="cleanServiceAttrs" checked>
          Очистка от служебных атрибутов
        </label>
        <label class="option-plate" title="Ищет атрибуты с пустым значением (src=&quot;&quot;, href=&quot;&quot; и т.п.) — почти всегда ошибка. alt=&quot;&quot; не считается: легитимный приём для декоративных картинок">
          <input type="checkbox" id="checkEmptyAttrs" checked>
          Проверка пустых атрибутов
        </label>
      </div>
      <button type="button" id="advancedToggle" class="advanced-toggle" aria-expanded="false">
        <span id="advancedToggleLabel">Дополнительно</span>
        <span class="advanced-toggle-arrow" aria-hidden="true"></span>
      </button>
      <div class="options-row-advanced" id="advancedOptions" hidden>
        <label class="option-plate">
          <input type="checkbox" id="collapseOutlookComments">
          Сжать комментарии для Outlook
        </label>
      </div>
      <!-- #status — часть этой же grid-строки (см. .card { grid-template-rows:
           subgrid } в CSS): у .card ровно 4 прямых ребёнка под 4 строки
           общей сетки main, пятому просто неоткуда взять свою строку — он
           либо схлопывается, либо накладывается на соседей. -->
      <div id="status"></div>
    </div>
  </section>
  <section class="card card-output">
    <div class="card-label">
      <span>Результат</span>
    </div>
    <div class="output-wrap">
      <div id="scrollHintUp" class="scroll-hint scroll-hint-up"></div>
      <div id="scrollHintDown" class="scroll-hint scroll-hint-down"></div>
      <div class="output-clip">
        <pre id="outputLineNumbers" class="line-numbers" aria-hidden="true"></pre>
        <svg id="popupConnectors" class="popup-connectors"></svg>
        <div id="outputPopups" class="output-popups"></div>
        <div id="lockedTooltip" class="locked-tooltip"></div>
        <textarea id="outputEditor" class="output-editor" spellcheck="false"></textarea>
        <pre id="output"></pre>
      </div>
    </div>
    <div class="card-footer">
      <button id="copyBtn" class="btn-secondary" type="button">Скопировать</button>
    </div>
    <div class="status-plates-row">
      <div id="outputStatus" class="status-plate"></div>
      <div id="emptyAttrsFillStatus" class="status-plate"></div>
      <div id="emptyAttrsDeleteStatus" class="status-plate"></div>
    </div>
  </section>
</main>

<script src="formatter.bundle.js"></script>
<script>
  const input = document.getElementById("input");
  const inputHighlight = document.getElementById("inputHighlight");
  const inputLineNumbers = document.getElementById("inputLineNumbers");
  const output = document.getElementById("output");
  const outputEditor = document.getElementById("outputEditor");
  const outputLineNumbers = document.getElementById("outputLineNumbers");
  const scrollHintUp = document.getElementById("scrollHintUp");
  const scrollHintDown = document.getElementById("scrollHintDown");
  const outputPopups = document.getElementById("outputPopups");
  const lockedTooltip = document.getElementById("lockedTooltip");
  const popupConnectors = document.getElementById("popupConnectors");
  const outputStatus = document.getElementById("outputStatus");
  const emptyAttrsFillStatus = document.getElementById("emptyAttrsFillStatus");
  const emptyAttrsDeleteStatus = document.getElementById("emptyAttrsDeleteStatus");
  const status = document.getElementById("status");
  const formatBtn = document.getElementById("formatBtn");
  const copyBtn = document.getElementById("copyBtn");
  const collapseOutlookComments = document.getElementById("collapseOutlookComments");
  const typografy = document.getElementById("typografy");
  const checkUnclosedTags = document.getElementById("checkUnclosedTags");
  const cleanServiceAttrs = document.getElementById("cleanServiceAttrs");
  const checkEmptyAttrs = document.getElementById("checkEmptyAttrs");
  const advancedToggle = document.getElementById("advancedToggle");
  const advancedToggleLabel = document.getElementById("advancedToggleLabel");
  const advancedOptions = document.getElementById("advancedOptions");

  // "Дополнительно" — просто show/hide, ничего не запускает само по себе
  // (как и остальные чекбоксы этого ряда — см. комментарий у formatBtn
  // ниже): значение "Сжать комментарии для Outlook" читается в момент
  // запуска форматирования, не раньше. aria-expanded — и для доступности,
  // и как крючок для разворота стрелки в CSS (см. .advanced-toggle-arrow).
  advancedToggle.addEventListener("click", () => {
    const willShow = advancedOptions.hidden;
    advancedOptions.hidden = !willShow;
    advancedToggle.setAttribute("aria-expanded", String(willShow));
    advancedToggleLabel.textContent = willShow ? "Скрыть" : "Дополнительно";
  });

  // lastCleanHtml — настоящий результат formatHtml (то, что копирует
  // кнопка "Скопировать"). Обычно совпадает с тем, что вернул форматтер,
  // но пользователь может явно "принять" подсказанный закрывающий тег
  // через попап (см. acceptSuggestion) — тогда он дописывается сюда по-
  // настоящему, текстом, и это уже не отменить кнопкой "Отклонить".
  let lastCleanHtml = "";
  // Рабочая копия unclosedTags — можно мутировать (убрать запись при
  // принятии/отклонении подсказки, сдвинуть номера строк у остальных
  // записей после вставки), в отличие от исходного результата форматтера.
  // __uid — стабильный на всё время жизни записи идентификатор (не
  // индекс в массиве, который меняется при удалении элементов) — по нему
  // находим соответствующий <span class="suggested-tag"> в DOM и
  // связываем красный флажок с попапом.
  let workingTags = [];
  let uidCounter = 0;
  let lastOpenFlags = []; // [{row, tagName, uid}] — красные, строка открывающего тега
  let lastCloseFlags = []; // [{row, tagName, uid}] — серые, строка подсказки (пока не решена)
  // origToFinalRow[N] — на какой ФАКТИЧЕСКИ отображаемой строке (индекс в
  // #output после вставки строк-подсказок для reliable-тегов, см.
  // buildDisplayHtml) оказалась N-я строка исходного lastCleanHtml.
  // lastEmptyAttrsFill/Delete хранят номера строк именно в системе
  // lastCleanHtml (как и остальная диагностика), поэтому клику по ним
  // (см. handleEmptyAttrLineClick) нужен этот пересчёт в реальную строку
  // на экране.
  let lastOrigToFinalRow = [];
  // line -> attrName -> [{attrEl, valEl}] — где именно в текущем DOM
  // #output физически находится каждый пустой атрибут, чтобы клик по
  // номеру строки в плашке "Пустые атрибуты" мог проскроллить и мигнуть
  // ИМЕННО на нём, а не пересчитывать координаты вручную (см.
  // buildEmptyAttrDomIndex/handleEmptyAttrLineClick). Перестраивается
  // заново при каждом renderOutput — старые ссылки на DOM-узлы после
  // output.innerHTML = ... всё равно становятся недействительными.
  let emptyAttrDomIndex = new Map();
  // Сколько подсказок пользователь явно отклонил (✕ в попапе) за текущий
  // результат форматирования — сбрасывается при каждом новом runFormat,
  // растёт только через rejectSuggestion. Показывается в outputStatus.
  let rejectedCount = 0;
  // Сколько тегов форматтер изначально пометил как незакрытые за этот
  // прогон (до любых accept/reject) — нужно, чтобы отличить "отклонили
  // ВСЕ подряд" (реально ничего не исправлено, просто перестали
  // показывать) от обычного "сбалансировано" (что-то было принято по-
  // настоящему или незакрытых не было вовсе). См. updateOutputStatus.
  let totalFlaggedCount = 0;
  // true сразу после того, как пользователь начал печатать прямо в
  // #outputEditor (см. его "input"-listener ниже) — диагностика на этот
  // момент устарела (workingTags сброшен, ничего заново не пересчитано),
  // так что статус-плашка должна промолчать, а не соврать "сбалансировано"
  // только потому, что openCount формально стал 0. Сбрасывается обратно
  // в false при следующем реальном прогоне форматтера (см. applyFormatResult).
  let outputEditedManually = false;
  // Последний результат диагностики пустых атрибутов (см.
  // EmptyAttrGroup/categorizeEmptyAttr в src/formatter.ts) —
  // [{ attrName, lines }] по каждой из двух категорий, обновляются в
  // applyFormatResult (не трогаются при accept/reject подсказок по
  // тегам — независимая диагностика) и в deleteAllEmptyAttrs (только
  // Delete — после удаления атрибутов список пуст). См.
  // updateEmptyAttrsStatus.
  let lastEmptyAttrsFill = [];
  let lastEmptyAttrsDelete = [];

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // Заполняет колонку номеров строк (см. .line-numbers) — просто список
  // "1..count", по одному числу на строку, без какой-либо связи с
  // содержимым (номер строки — это её порядковый номер в ОТОБРАЖЕНИИ, то
  // есть считая и серые строки-подсказки в #output — так же, как если бы
  // считали строки на глаз сверху вниз).
  function updateLineNumbers(el, count) {
    el.textContent = Array.from({ length: count }, (_, i) => i + 1).join("\n");
  }

  // Все места, что двигают вертикальный скролл программно (не через
  // пользовательский скролл мышью/тачпадом/клавиатурой — для того есть
  // отдельный "scroll"-listener на #outputEditor ниже), выставляют его
  // именно на #outputEditor: это теперь основной интерактивный слой
  // (см. .output-editor в CSS — прозрачный textarea поверх #output,
  // как и у поля ввода), #output и #outputLineNumbers — только
  // визуальные слои под ним, синхронизируются от него же.
  function setOutputScrollTop(value) {
    outputEditor.scrollTop = value;
    output.scrollTop = outputEditor.scrollTop;
    outputLineNumbers.scrollTop = outputEditor.scrollTop;
    // void ... .offsetHeight — форсирует синхронный reflow сразу после
    // программного scrollTop (см. .line-numbers/.editor-highlight/#output
    // в CSS про то же самое) — подстраховка на случай, если одного
    // только translateZ(0)-слоя браузеру не хватит, чтобы честно
    // перерисовать содержимое вслед за уже обновившимся scrollTop.
    void output.offsetHeight;
    void outputLineNumbers.offsetHeight;
  }

  // Раскрашивает атрибуты тега: имя одним цветом, значение (в кавычках
  // или без) — другим. Разбор нестрогий (только для подсветки, сама
  // строка атрибутов нигде не меняется и не переформатируется).
  function highlightAttrs(attrsRaw) {
    let out = "";
    const re = /(\s+)|([^\s=]+)(=("[^"]*"|'[^']*'|[^\s]*))?/g;
    let m;
    while ((m = re.exec(attrsRaw))) {
      if (m[1] !== undefined) {
        out += escapeHtml(m[1]);
        continue;
      }
      out += `<span class="tok-attr">${escapeHtml(m[2])}</span>`;
      if (m[3] !== undefined) {
        out += "=";
        out += `<span class="tok-val">${escapeHtml(m[4])}</span>`;
      }
    }
    return out;
  }

  function highlightOpenTag(node) {
    const attrsHtml = node.attrsRaw ? " " + highlightAttrs(node.attrsRaw) : "";
    const closer = node.selfClosed ? " /&gt;" : "&gt;";
    return (
      `<span class="tok-tag">&lt;${escapeHtml(node.tagName)}</span>` +
      attrsHtml +
      `<span class="tok-tag">${closer}</span>`
    );
  }

  function highlightCloseTag(tagName) {
    return `<span class="tok-tag">&lt;/${escapeHtml(tagName)}&gt;</span>`;
  }

  // "Плоская" версия highlightOpenTag/highlightCloseTag/highlightNode —
  // без раскраски по типам токенов (тег/атрибут/значение), просто
  // экранированный текст. Нужна только для содержимого условных
  // ("outlook") комментариев: снаружи их целиком красит один общий серый
  // span (см. tok-outlook-comment в highlightNode ниже) — красить теги
  // внутри ещё и по отдельности не нужно и только мешало бы читать.
  function plainOpenTag(node) {
    const attrs = node.attrsRaw ? " " + node.attrsRaw : "";
    const closer = node.selfClosed ? " />" : ">";
    return escapeHtml(`<${node.tagName}${attrs}${closer}`);
  }

  function plainCloseTag(tagName) {
    return escapeHtml(`</${tagName}>`);
  }

  function plainNode(node) {
    switch (node.type) {
      case "text":
        return escapeHtml(node.value);
      case "doctype":
        return escapeHtml(node.raw);
      case "comment":
        return escapeHtml(`<!--${node.raw}-->`);
      case "stray-close-tag":
        return escapeHtml(node.raw);
      case "conditional-comment": {
        const inner = node.children.map(plainNode).join("");
        return escapeHtml(node.openRaw) + inner + escapeHtml(node.closeRaw);
      }
      case "raw-text":
      case "style":
        return plainOpenTag(node) + escapeHtml(node.rawContent) + plainCloseTag(node.tagName);
      case "element": {
        const open = plainOpenTag(node);
        if (node.voidElement || node.selfClosed) return open;
        const inner = node.children.map(plainNode).join("");
        if (!node.explicitlyClosed) return open + inner;
        return open + inner + plainCloseTag(node.tagName);
      }
      default:
        return "";
    }
  }

  // Подсветка строится по тому же AST, что использует сам форматтер
  // (window.HtmlFormatter.parseHtml — тот же парсер, что и в CLI/Node), а
  // не отдельным regex-разбором "на глаз": так гарантированно не
  // перепутать, например, "<" внутри атрибута или комментария с началом
  // настоящего тега.
  function highlightNode(node) {
    switch (node.type) {
      case "text":
        return escapeHtml(node.value);
      case "doctype":
        return `<span class="tok-doctype">${escapeHtml(node.raw)}</span>`;
      case "comment":
        return `<span class="tok-comment">&lt;!--${escapeHtml(node.raw)}--&gt;</span>`;
      case "stray-close-tag":
        return `<span class="tok-tag">${escapeHtml(node.raw)}</span>`;
      case "conditional-comment": {
        // Условный комментарий целиком (маркеры + всё содержимое, включая
        // вложенные теги) — один сплошной серый блок, без раскраски по
        // типам токенов внутри, см. plainNode.
        return `<span class="tok-outlook-comment">${plainNode(node)}</span>`;
      }
      case "raw-text":
      case "style":
        return (
          highlightOpenTag(node) + escapeHtml(node.rawContent) + highlightCloseTag(node.tagName)
        );
      case "element": {
        const open = highlightOpenTag(node);
        if (node.voidElement || node.selfClosed) return open;
        const inner = node.children.map(highlightNode).join("");
        if (!node.explicitlyClosed) return open + inner;
        return open + inner + highlightCloseTag(node.tagName);
      }
      default:
        return "";
    }
  }

  function highlightHtml(formatted) {
    const doc = window.HtmlFormatter.parseHtml(formatted);
    return doc.children.map(highlightNode).join("");
  }

  // <textarea> и <pre> расходятся в том, как считают высоту содержимого,
  // если оно заканчивается "голым" переносом строки (\n без чего-либо
  // после): textarea резервирует под ним ещё одну (пустую) строку высоты,
  // а pre — нет, попросту не рисуя эту строку вовсе. #inputHighlight/
  // #output — как раз pre поверх/под настоящим textarea (#input/
  // #outputEditor) с ТЕМ ЖЕ текстом — из-за этого расхождения их
  // scrollHeight отличается ровно на одну строку, и синхронизация скролла
  // (простое копирование scrollTop) у более короткого из них "залипает"
  // при подходе к концу документа: браузер молча приравнивает scrollTop
  // к своему максимуму, который у pre меньше. Внешне это выглядит как
  // рассинхрон номеров строк и текста в самом низу — реальный курсor
  // (внутри настоящего textarea) при этом стоит верно, просто видимый
  // подсвеченный слой отстаёт на 21px. Невидимый zero-width space в конце
  // — стандартный приём: он не меняет отображаемый текст ни на пиксель по
  // ширине, но заставляет браузер выделить место под "фантомную" последнюю
  // строку, той же высоты, что и у textarea, — синхронизация снова точная.
  const TRAILING_LINE_MARKER = "​";

  function withTrailingLineMarker(renderedHtml) {
    return renderedHtml.endsWith("\n") ? renderedHtml + TRAILING_LINE_MARKER : renderedHtml;
  }

  // Подсветка исходника — та же самая функция, что и для результата,
  // просто применённая к текущему значению textarea "вживую", на каждое
  // изменение. Парсер терпим к незакрытым/битым тегам (то же самое
  // прощение недописанной разметки, что используется при форматировании)
  // и не должен падать по ходу набора текста, но на всякий случай — если
  // что-то пойдёт не так, просто показываем текст без подсветки, а не
  // ломаем ввод.
  function updateInputHighlight() {
    // Пустое поле — всё равно "строка 1" (как в большинстве редакторов),
    // а не пустая колонка номеров.
    updateLineNumbers(inputLineNumbers, input.value ? input.value.split("\n").length : 1);
    if (!input.value) {
      inputHighlight.innerHTML = "";
      return;
    }
    try {
      inputHighlight.innerHTML = withTrailingLineMarker(highlightHtml(input.value));
    } catch {
      inputHighlight.textContent = input.value;
      if (input.value.endsWith("\n")) inputHighlight.append(TRAILING_LINE_MARKER);
    }
  }

  function syncInputScroll() {
    inputHighlight.scrollTop = input.scrollTop;
    inputHighlight.scrollLeft = input.scrollLeft;
    // Только вертикально — колонка номеров не скроллится по горизонтали
    // вместе с длинными строками, она должна оставаться "прибитой" слева.
    inputLineNumbers.scrollTop = input.scrollTop;
    // См. тот же приём в setOutputScrollTop — форсирует синхронный reflow
    // сразу после программного scrollTop, подстраховка к translateZ(0) в
    // CSS против отставания ОТРИСОВКИ (не разметки) этих слоёв от уже
    // обновившегося scrollTop при частых событиях скролла.
    void inputHighlight.offsetHeight;
    void inputLineNumbers.offsetHeight;
  }

  // Пустая строка в самом начале или в самом конце вставленного/введённого
  // HTML реально ломает форматирование (пользователь проверил на реальном
  // письме) — проще не пускать её в поле ввода вовсе, чем чинить её
  // последствия в парсере. НЕ делаем это на КАЖДОЕ нажатие клавиши в
  // updateInputHighlight — иначе Enter в самом конце документа (обычный
  // способ начать новую строку контента) тут же "схлопывался" бы обратно,
  // и дописать что-то новой строкой в конце стало бы физически невозможно.
  // Вместо этого чистим в трёх безопасных точках, где пользователь уже
  // закончил (или вот-вот закончит) редактировать именно этот кусок: сразу
  // после вставки (paste), при уходе фокуса с поля (blur) и прямо перед
  // запуском форматирования (runFormat, см. ниже) — на выходе результат
  // тот же ("физически" в поле ввода пустая строка с краю не задерживается
  // дольше одного клика/вставки), но набор текста ничем не мешает.
  function stripEdgeBlankLines(text) {
    return text.replace(/^(?:[ \t]*\r?\n)+/, "").replace(/(?:\r?\n[ \t]*)+$/, "");
  }

  function enforceNoEdgeBlankLines() {
    const original = input.value;
    const trimmed = stripEdgeBlankLines(original);
    if (trimmed === original) return;
    const removedFromStart = original.length - original.replace(/^(?:[ \t]*\r?\n)+/, "").length;
    const selStart = input.selectionStart;
    const selEnd = input.selectionEnd;
    input.value = trimmed;
    input.setSelectionRange(
      Math.max(0, Math.min(trimmed.length, selStart - removedFromStart)),
      Math.max(0, Math.min(trimmed.length, selEnd - removedFromStart)),
    );
    updateInputHighlight();
  }

  input.addEventListener("input", updateInputHighlight);
  input.addEventListener("scroll", syncInputScroll);
  // setTimeout — вставка (paste) должна сначала реально примениться к
  // input.value браузером, самого события paste для этого недостаточно
  // (оно летит ДО того, как значение поля обновится).
  input.addEventListener("paste", () => setTimeout(enforceNoEdgeBlankLines, 0));
  input.addEventListener("blur", enforceNoEdgeBlankLines);
  updateInputHighlight();

  // Строит отображаемый HTML для #output: подсвеченный результат
  // (highlightHtml) плюс вставленные "строки-подсказки" с предполагаемым
  // закрывающим тегом для каждого элемента из workingTags — серым
  // цветом (см. .suggested-line). Место вставки (insertBeforeLine/depth)
  // уже вычислено в самом форматтере — это точка, где ближайший предок с
  // настоящим закрывающим тегом неявно "утащил" незакрытый тег за собой
  // (см. explicitlyClosed/leakMark в src/formatter.ts). Пока пользователь
  // явно не нажал "Добавить" в попапе — эта строка есть только в
  // ОТОБРАЖЕНИИ, в lastCleanHtml (то, что копирует кнопка "Скопировать")
  // её нет.
  //
  // Сам текст предполагаемого тега обёрнут в отдельный <span
  // class="suggested-tag" data-uid="..."> — по нему renderPopups находит
  // его реальные координаты в DOM (getBoundingClientRect), чтобы попап
  // "Добавить?" встал вплотную к тегу, без ручного подсчёта ширины
  // отступа в пикселях.
  //
  // Если несколько тегов вытесняются в одной и той же точке — сортируем
  // по глубине по убыванию, чтобы более вложенные закрывались первыми
  // (как и положено при обычной вложенности тегов).
  //
  // Серую строку-подсказку, серый флажок и попап показываем ТОЛЬКО для
  // insertConfidence === "reliable" — когда insertBeforeLine и правда
  // указывает на то самое место, где браузер закрыл бы тег (закрытием
  // его собственного предка либо концом документа). Для "uncertain"
  // (тег вытеснен попутно чужим "ничьим" совпадением из совсем другой
  // ветки документа) показывать конкретное место — вводить в
  // заблуждение: например, там уже может стоять настоящий закрывающий
  // тег для СОВСЕМ ДРУГОГО элемента, и предложенный серый тег рядом с
  // ним выглядел бы как явно некорректный дубль. Такие теги остаются
  // только с красным флажком, без предложения.
  //
  // tags — общий список ВСЕХ трёх видов диагностики (u.kind ===
  // "unclosed" | "unopened" | "extra", см. runFormat): для незакрытых и
  // "неоткрытых" тегов подсказка — это одна вставленная серая строка
  // перед insertBeforeLine на глубине depth, различается только текст
  // самого тега (закрывающий тег для unclosed, открывающий — для
  // unopened) и то, что unopenedTags.insertConfidence всегда "reliable"
  // по построению (см. checkUnopenedChild в src/formatter.ts — там уже
  // отфильтрованы неоднозначные случаи через leakStack).
  //
  // "extra" — принципиально другое: это не вставка НОВОЙ строки, а
  // пометка УЖЕ СУЩЕСТВУЮЩЕЙ (осиротевший закрывающий тег без пары, см.
  // ExtraTagInfo) — предложение "Удалить?" её целиком. Поэтому такие
  // записи не участвуют в insertions вовсе (см. фильтр kind !== "extra"
  // ниже), а вместо этого их существующая строка оборачивается в
  // <span class="extra-tag-anchor" data-uid="..."> — тот же приём для
  // поиска реальных координат в DOM, что и .suggested-tag у вставленных
  // строк, только оборачивает не новый, а уже существующий текст.
  function buildDisplayHtml(html, tags) {
    const highlightedLines = highlightHtml(html).split("\n");
    const insertions = tags
      .filter((u) => u.kind !== "extra" && u.insertConfidence === "reliable")
      .slice()
      .sort((a, b) => a.insertBeforeLine - b.insertBeforeLine || b.depth - a.depth);
    const extraByLine = new Map();
    for (const u of tags) {
      if (u.kind === "extra") extraByLine.set(u.line, u);
    }
    // Только для kind==="unclosed": единственный случай, где "место
    // открытия" (u.line) и "место предполагаемой починки"
    // (u.insertBeforeLine) — РАЗНЫЕ строки документа, порой очень далеко
    // друг от друга (см. renderPopups — там у этой же строки будет ещё
    // один, дублирующий попап). У unopened line===insertBeforeLine всегда
    // (см. присвоение line ниже, в applyFormatResult), так что для него
    // отдельный якорь не нужен.
    const unclosedOpenByLine = new Map();
    for (const u of tags) {
      if (u.kind === "unclosed" && u.insertConfidence === "reliable") unclosedOpenByLine.set(u.line, u);
    }

    const resultLines = [];
    const origToFinalRow = new Array(highlightedLines.length);
    const closeFlags = [];
    let insIdx = 0;

    for (let orig = 0; orig <= highlightedLines.length; orig++) {
      while (insIdx < insertions.length && insertions[insIdx].insertBeforeLine === orig) {
        const u = insertions[insIdx];
        const indent = "  ".repeat(u.depth);
        const tagText = u.kind === "unopened" ? "<" + u.tagName + ">" : "</" + u.tagName + ">";
        resultLines.push(
          `<span class="suggested-line">${escapeHtml(indent)}` +
            `<span class="suggested-tag" data-uid="${u.__uid}">${escapeHtml(tagText)}</span></span>`,
        );
        closeFlags.push({ row: resultLines.length - 1, tagName: u.tagName, uid: u.__uid, kind: u.kind });
        insIdx++;
      }
      if (orig < highlightedLines.length) {
        origToFinalRow[orig] = resultLines.length;
        const extra = extraByLine.get(orig);
        const unclosedOpen = unclosedOpenByLine.get(orig);
        if (extra) {
          // Отступ оставляем СНАРУЖИ якоря (как и у .suggested-tag —
          // см. вставку строк-подсказок выше): иначе его ширина попадает
          // в getBoundingClientRect и computePopupSide начинает считать
          // тег шире, чем он есть на самом деле, из-за чего попап иногда
          // без нужды уезжает направо. Отступ у "ничьего" закрывающего
          // тега — всегда ЧИСТЫЕ пробелы (this.indent() в
          // src/formatter.ts), без тегов внутри, так что вырезать его
          // простым regex по началу строки безопасно.
          const line = highlightedLines[orig];
          const leadingWs = /^ */.exec(line)[0];
          resultLines.push(
            leadingWs +
              `<span class="extra-tag-anchor" data-uid="${extra.__uid}">${line.slice(leadingWs.length)}</span>`,
          );
        } else if (unclosedOpen) {
          // Тот же приём — якорь для ДУБЛИКАТА попапа у места открытия
          // (см. unclosedOpenByLine выше и renderPopups). Отступ у ЛЮБОЙ
          // строки — те же чистые пробелы this.indent(), приём безопасен
          // не только для "ничьих" закрывающих тегов.
          const line = highlightedLines[orig];
          const leadingWs = /^ */.exec(line)[0];
          resultLines.push(
            leadingWs +
              `<span class="unclosed-open-anchor" data-uid="${unclosedOpen.__uid}">${line.slice(leadingWs.length)}</span>`,
          );
        } else {
          resultLines.push(highlightedLines[orig]);
        }
      }
    }

    // Красный флажок на СВОЕЙ строке пропускаем для "неоткрытых", у
    // которых есть пара (pairId) — сама пара уже ЯВЛЯЕТСЯ "лишним" тегом
    // (kind==="extra") у себя на строке, и он получит СВОЙ красный
    // флажок ниже по этому же tags.map (та запись присутствует в общем
    // списке). Показывать два флажка на два конца одной и той же связки
    // избыточно — источник проблемы нагляднее там, где стоит сам лишний
    // тег, а не там, где просто заметили нехватку родителя.
    const openFlags = tags
      .filter((u) => !(u.kind === "unopened" && u.pairId != null))
      .map((u) => ({
        row: origToFinalRow[u.line],
        tagName: u.tagName,
        uid: u.__uid,
        kind: u.kind,
      }));

    return {
      displayHtml: resultLines.join("\n"),
      openFlags,
      closeFlags,
      lineCount: resultLines.length,
      origToFinalRow,
    };
  }

  // Скроллит #output так, чтобы указанный элемент (реальный DOM-узел,
  // не номер строки — координаты берём через getBoundingClientRect, это
  // надёжнее ручного подсчёта row*lineHeight) оказался примерно по
  // центру видимой области.
  function scrollElementIntoView(el) {
    const outputRect = output.getBoundingClientRect();
    const elRect = el.getBoundingClientRect();
    const delta = elRect.top - outputRect.top;
    setOutputScrollTop(
      Math.max(0, outputEditor.scrollTop + delta - outputEditor.clientHeight / 2 + elRect.height / 2),
    );
    updateScrollHints();
    renderPopups();
  }

  // То же самое, но по номеру строки — нужно для клика по серому флажку:
  // у открывающего тега нет своего span-маркера в DOM (в отличие от
  // предполагаемого закрывающего — см. .suggested-tag), поэтому для него
  // используем уже известную по lastOpenFlags строку напрямую.
  function scrollRowIntoView(row) {
    const cs = getComputedStyle(output);
    const paddingTop = parseFloat(cs.paddingTop) || 0;
    const lineHeight = parseFloat(cs.lineHeight) || 0;
    const target = paddingTop + row * lineHeight;
    setOutputScrollTop(Math.max(0, target - outputEditor.clientHeight / 2 + lineHeight / 2));
    updateScrollHints();
    renderPopups();
  }

  // role — "open" (красный, на строке самой проблемы) или "close" (серый,
  // на строке ещё не решённой подсказки — для kind="extra" такой роли не
  // бывает вовсе, у неё нет отдельной "вставленной" строки, только сама
  // проблемная); kind — "unclosed" (не хватает закрывающего тега),
  // "unopened" (не хватает родителя-обёртки, см. checkUnopenedChild в
  // src/formatter.ts) или "extra" (сам этот тег — осиротевший закрывающий
  // без пары, см. ExtraTagInfo, предлагается удалить). tagName для
  // kind="unopened"/"extra" — это имя тега-СВЯЗИ (пропущенного родителя
  // или лишнего закрывающего), а не самого узла на этой строке — так и
  // формулируются заголовки ниже.
  function flagTitle(kind, role, tagName) {
    if (kind === "unopened") {
      return role === "open"
        ? `Похоже, здесь пропущен родительский тег <${tagName}>`
        : `Добавить открывающий тег <${tagName}>?`;
    }
    if (kind === "extra") {
      return `Похоже, этот тег лишний — нет пары <${tagName}>`;
    }
    return role === "open" ? `Тег <${tagName}> может быть не закрыт` : "Вероятно, здесь пропущен тег";
  }

  // Клик по видимому флажку — переход к ПАРНОМУ месту (реальные
  // координаты через .suggested-tag, либо через .extra-tag-anchor для
  // kind="extra" — там это не вставленная строка, а помеченная
  // существующая); клик по серому — обратно к красному (по row, у
  // открывающего тега нет своего DOM-маркера). Общая для флажков внутри
  // номеров строк (см. renderOutputLineNumbers) и для клика по ним же —
  // подсказки за пределами экрана (.scroll-hint) используют ДРУГую
  // логику — прыгают к себе самим, а не к парному, см. setScrollHint.
  function handleFlagClick(role, kind, uid) {
    if (role === "open") {
      const selector =
        kind === "extra" ? `.extra-tag-anchor[data-uid="${uid}"]` : `.suggested-tag[data-uid="${uid}"]`;
      const tagEl = output.querySelector(selector);
      if (tagEl) scrollElementIntoView(tagEl);
    } else {
      const paired = lastOpenFlags.find((f) => f.uid === uid);
      if (paired) scrollRowIntoView(paired.row);
    }
  }

  // Флажков больше нет в отдельном гаттере — каждый печатается ПРЯМО
  // ВМЕСТО номера своей строки (см. .line-flag в CSS): один список
  // строк, просто на части из них вместо цифры — эмодзи. Позиция флажка
  // при скролле не пересчитывается отдельно — он часть текстового
  // содержимого .line-numbers, скроллится вместе с ним через
  // обычный scrollTop, без ручной раскладки.
  function renderOutputLineNumbers(lineCount) {
    const byRow = new Map();
    for (const f of lastOpenFlags) byRow.set(f.row, { ...f, role: "open" });
    for (const f of lastCloseFlags) byRow.set(f.row, { ...f, role: "close" });
    let html = "";
    for (let i = 0; i < lineCount; i++) {
      if (i > 0) html += "\n";
      const f = byRow.get(i);
      if (!f) {
        html += i + 1;
        continue;
      }
      const cls = "line-flag" + (f.role === "close" ? " line-flag-close" : "");
      html +=
        `<span class="${cls}" data-role="${f.role}" data-kind="${f.kind}" data-uid="${f.uid}" ` +
        `title="${escapeHtml(flagTitle(f.kind, f.role, f.tagName))}">🚩</span>`;
    }
    outputLineNumbers.innerHTML = html;
  }
  outputLineNumbers.addEventListener("click", (e) => {
    const el = e.target.closest(".line-flag");
    if (!el) return;
    handleFlagClick(el.dataset.role, el.dataset.kind, el.dataset.uid);
  });

  // Подсказка "ближайший флажок сейчас за пределами экрана" (см.
  // .scroll-hint в CSS) — вызывается и при перерисовке (renderOutput), и
  // при скролле (флажок мог войти/выйти из видимой области). Ищет среди
  // ВСЕХ флажков (открывающих и подсказок-вставок вперемешку — тут не
  // важно, какой это тип, важно только "выше/ниже экрана и насколько
  // близко") ближайший НАД видимой областью и ближайший ПОД ней —
  // каждый в свою подсказку.
  function updateScrollHints() {
    const cs = getComputedStyle(output);
    const paddingTop = parseFloat(cs.paddingTop) || 0;
    const lineHeight = parseFloat(cs.lineHeight) || 0;
    const all = [
      ...lastOpenFlags.map((f) => ({ ...f, role: "open" })),
      ...lastCloseFlags.map((f) => ({ ...f, role: "close" })),
    ];
    const viewTop = outputEditor.scrollTop;
    const viewBottom = viewTop + outputEditor.clientHeight;
    let nearestAbove = null;
    let nearestBelow = null;
    for (const f of all) {
      const y = paddingTop + f.row * lineHeight;
      if (y < viewTop) {
        if (!nearestAbove || f.row > nearestAbove.row) nearestAbove = f;
      } else if (y + lineHeight > viewBottom) {
        if (!nearestBelow || f.row < nearestBelow.row) nearestBelow = f;
      }
    }
    setScrollHint(scrollHintUp, "up", nearestAbove);
    setScrollHint(scrollHintDown, "down", nearestBelow);
  }

  // Клик по самой подсказке (в отличие от клика по видимому флажку,
  // см. handleFlagClick) — просто скроллит к СВОЕЙ ЖЕ строке (flag.row):
  // цель подсказки — показать флажок, который сейчас не виден, а не
  // перейти к его паре.
  function setScrollHint(el, direction, flag) {
    if (!flag) {
      el.classList.remove("visible");
      el.onclick = null;
      el.title = "";
      return;
    }
    el.classList.add("visible");
    const flagSpan = `<span class="line-flag${flag.role === "close" ? " line-flag-close" : ""}">🚩</span>`;
    const arrowSpan = `<span class="arrow">${direction === "up" ? "▲" : "▼"}</span>`;
    el.innerHTML = direction === "up" ? arrowSpan + flagSpan : flagSpan + arrowSpan;
    el.title = flagTitle(flag.kind, flag.role, flag.tagName);
    el.onclick = () => scrollRowIntoView(flag.row);
  }

  // ==========================================================
  // === НАЧАЛО: изолированный блок "умного" позиционирования попапов ===
  // Вся геометрия (с какой стороны от тега вставать, как разводить
  // столкновения по вертикали, как рисовать линию-указатель) собрана
  // здесь, в одной функции positionSuggestPopups и её приватных
  // помощниках — renderPopups ниже только создаёт DOM-содержимое попапов
  // (текст/кнопки) и передаёт готовые элементы сюда одним вызовом.
  //
  // ОТКАТ: чтобы вернуться к прежней простой версии (попап всегда слева
  // от тега, статичный CSS-хвостик, разведение по вертикали без
  // пересчёта указателя) — удалить этот блок целиком, в renderPopups
  // вернуть простое позиционирование popup.style.top/left сразу при
  // создании (без вызова positionSuggestPopups), убрать <svg
  // id="popupConnectors"> из HTML и .popup-connectors из CSS.
  const POPUP_GAP = 15; // отступ между попапом и точкой на теге

  // С какой стороны тега (left/right) ставить попап: слева — если там
  // достаточно места (не заходя за левый край .output-wrap), иначе —
  // справа от тега. Это и есть решение обеих исходных проблем: попап
  // либо помещается слева целиком, либо переставляется на сторону, где
  // места заведомо достаточно, а не "прижимается" туда же силой.
  function choosePopupSide(tagRect, wrapRect, popupWidth) {
    const availableLeft = tagRect.left - wrapRect.left;
    return availableLeft >= popupWidth + POPUP_GAP ? "left" : "right";
  }

  function naturalPlacement(tagRect, wrapRect, popupWidth, popupHeight, side) {
    const centerY = tagRect.top - wrapRect.top + tagRect.height / 2;
    const left =
      side === "left"
        ? tagRect.left - wrapRect.left - POPUP_GAP - popupWidth
        : tagRect.right - wrapRect.left + POPUP_GAP;
    return { top: centerY - popupHeight / 2, left };
  }

  // Разводит по вертикали попапы, которые пересекались бы друг с другом
  // — отдельно для каждой стороны (left/right), потому что попапы с
  // разных сторон от своих тегов практически никогда не претендуют на
  // одно и то же место. Мутирует entry.top.
  function resolveVerticalCollisions(entries) {
    const GAP_BETWEEN = 4;
    for (const side of ["left", "right"]) {
      const group = entries.filter((e) => e.side === side).sort((a, b) => a.top - b.top);
      let minTop = -Infinity;
      for (const entry of group) {
        if (entry.top < minTop) entry.top = minTop;
        minTop = entry.top + entry.height + GAP_BETWEEN;
      }
    }
  }

  // Линия-указатель от попапа до РЕАЛЬНОЙ точки на теге — считается
  // заново из уже финальных (после разводки коллизий) координат, поэтому
  // всегда бьёт точно в цель, даже если сам попап пришлось сдвинуть.
  // Отступ конца стрелки от самого тега — раньше указатель утыкался
  // прямо в край текста тега, теперь останавливается чуть раньше.
  const CONNECTOR_GAP = 2;
  function drawConnectors(entries, wrapRect) {
    popupConnectors.innerHTML = "";
    const svgNS = "http://www.w3.org/2000/svg";
    for (const entry of entries) {
      const { tagRect, side, top, left, width, height } = entry;
      const tagX =
        side === "left"
          ? tagRect.left - wrapRect.left - CONNECTOR_GAP
          : tagRect.right - wrapRect.left + CONNECTOR_GAP;
      const tagY = tagRect.top - wrapRect.top + tagRect.height / 2;
      const popupX = side === "left" ? left + width : left;
      const popupY = top + height / 2;

      const line = document.createElementNS(svgNS, "line");
      line.setAttribute("x1", popupX);
      line.setAttribute("y1", popupY);
      line.setAttribute("x2", tagX);
      line.setAttribute("y2", tagY);
      popupConnectors.appendChild(line);

      const dot = document.createElementNS(svgNS, "circle");
      dot.setAttribute("cx", tagX);
      dot.setAttribute("cy", tagY);
      dot.setAttribute("r", 2.5);
      popupConnectors.appendChild(dot);
    }
  }

  // Точка входа: entries — уже созданные (label+кнопки), но ещё без
  // top/left попапы, каждый со своим tagRect. Все они уже должны быть в
  // DOM (outputPopups), иначе getBoundingClientRect ниже не даст верную
  // ширину/высоту.
  function positionSuggestPopups(entries, wrapRect) {
    for (const entry of entries) {
      const rect = entry.el.getBoundingClientRect();
      entry.width = rect.width;
      entry.height = rect.height;
      entry.side = choosePopupSide(entry.tagRect, wrapRect, entry.width);
      const placement = naturalPlacement(entry.tagRect, wrapRect, entry.width, entry.height, entry.side);
      entry.top = placement.top;
      entry.left = placement.left;
    }
    resolveVerticalCollisions(entries);
    for (const entry of entries) {
      entry.el.style.top = entry.top + "px";
      entry.el.style.left = entry.left + "px";
    }
    drawConnectors(entries, wrapRect);
  }
  // === КОНЕЦ: изолированный блок "умного" позиционирования попапов ===
  // ==========================================================

  // Попап "Добавить?"/"Удалить?" рядом с каждым отмеченным тегом.
  // Координаты берутся напрямую из реальных координат уже
  // отрендеренного якоря в DOM (getBoundingClientRect) — надёжнее и
  // точнее, чем пересчитывать ширину отступа вручную по количеству
  // символов. Для kind !== "extra" якорь — вставленная строка-подсказка
  // (<span class="suggested-tag">, только при insertConfidence ===
  // "reliable"); для kind === "extra" — обёрнутая существующая строка
  // (<span class="extra-tag-anchor">, см. buildDisplayHtml). Само
  // размещение попапов — отдельный изолированный блок выше
  // (positionSuggestPopups), эта функция только создаёт их содержимое.
  //
  // У kind==="unclosed" строится ДВА попапа на одну запись — один у
  // подсказки (как обычно), второй — дубликат у самого места открытия
  // тега (см. .unclosed-open-anchor/buildDisplayHtml): это единственный
  // вид диагностики, где "место проблемы" и "место починки" могут
  // оказаться далеко друг от друга по документу, и без дубликата на
  // экране в принципе не увидеть попап рядом с красным флажком, если
  // прокрутить именно к нему. У unopened/extra в этом нет нужды: у
  // одиночного unopened оба места совпадают, а у пары unopened+extra
  // каждая сторона — уже отдельная запись в workingTags и проходит этот
  // цикл сама по себе, каждая со своим попапом.
