  function renderPopups() {
    outputPopups.innerHTML = "";
    const wrapRect = output.parentElement.getBoundingClientRect();
    const outputRect = output.getBoundingClientRect();
    const entries = [];

    // mode — "delete" или "add", определяет и текст вопроса, и что делает
    // ✓ (см. вызовы ниже): это не привязано жёстко к u.kind напрямую,
    // потому что у unclosed вопрос зависит ещё и от ТОГО, на какой из
    // двух её строк стоит именно этот попап (см. renderPopups ниже) —
    // "Удалить?" там, где тег РЕАЛЬНО существует в письме (сам незакрытый
    // открывающий, сам осиротевший закрывающий у extra), "Добавить?" там,
    // где стоит только ПРЕДЛОЖЕННЫЙ, ещё не принятый тег (unopened,
    // закрывающая половина unclosed) — его-то мы и добавили бы. Реальный
    // тег можно только удалить, предложенного можно только добавить —
    // никаких промежуточных вариантов.
    function addPopup(u, tagEl, mode, pairRowOverride, isOpenSide) {
      if (!tagEl) return;
      const tagRect = tagEl.getBoundingClientRect();
      // Тег прокручен за пределы видимой области #output по вертикали —
      // не показываем попап впустую поверх соседних, не относящихся к
      // нему строк.
      if (tagRect.bottom < outputRect.top || tagRect.top > outputRect.bottom) return;

      const isDelete = mode === "delete";

      const popup = document.createElement("div");
      popup.className = "suggest-popup";

      const main = document.createElement("div");
      main.className = "suggest-popup-main";

      const label = document.createElement("span");
      label.textContent = isDelete ? "Удалить?" : "Добавить?";
      main.appendChild(label);

      const acceptBtn = document.createElement("button");
      acceptBtn.className = "accept";
      acceptBtn.type = "button";
      acceptBtn.textContent = "✓";
      if (isDelete) {
        // extra — реальный ЗАКРЫВАЮЩИЙ тег (осиротевший), unclosed на
        // открывающей стороне — реальный ОТКРЫВАЮЩИЙ; удаляем именно ту
        // строку, на которой стоим.
        const tagText = u.kind === "extra" ? `</${u.tagName}>` : `<${u.tagName}>`;
        acceptBtn.title = `Удалить ${tagText} из результата`;
        acceptBtn.addEventListener("click", () => acceptDeletion(u));
      } else {
        acceptBtn.title =
          u.kind === "unopened"
            ? `Добавить <${u.tagName}> в результат`
            : `Добавить </${u.tagName}> в результат`;
        acceptBtn.addEventListener("click", () => acceptSuggestion(u));
      }
      main.appendChild(acceptBtn);

      const rejectBtn = document.createElement("button");
      rejectBtn.className = "reject";
      rejectBtn.type = "button";
      rejectBtn.textContent = "✕";
      if (isDelete) {
        rejectBtn.title = "Не удалять";
        rejectBtn.addEventListener("click", () => rejectDeletion(u));
      } else {
        rejectBtn.title = "Не добавлять";
        rejectBtn.addEventListener("click", () => rejectSuggestion(u));
      }
      main.appendChild(rejectBtn);
      popup.appendChild(main);

      // Для парных unopened/extra (см. pairId в src/formatter.ts), а
      // также для unclosed (своя же собственная запись, просто её вторая,
      // открывающая, сторона) — ещё одна маленькая серая строка снизу со
      // ссылкой на строку ПАРНОГО тега, чтобы не искать её глазами по
      // всему выводу. Номер кликабелен — скроллит к этой строке (см.
      // .suggest-popup-pair-link/scrollRowIntoView), ничего не подсвечивая:
      // сам парный тег и так уже отмечен собственным флажком в колонке
      // номеров. Текст подписи — см. pairLabelFor: у попапа на РЕАЛЬНОМ,
      // уже существующем в письме теге (сам unclosed на своём месте
      // открытия, сам extra) парный тег ЕЩЁ НЕ существует — потому
      // "не найден"; у попапа на ПРЕДЛОЖЕННОМ (пока не принятом) теге
      // парный, наоборот, уже реально есть в письме — потому "найден".
      // pairRowOverride — только у дубликата на открывающей стороне (см.
      // pairedRowForOpenSide ниже): обычный pairedRow(u) для unclosed
      // всегда возвращает строку ОТКРЫТИЯ, а тут сам попап уже там стоит,
      // ссылаться нужно, наоборот, на строку подсказки.
      const pRow = pairRowOverride !== undefined ? pairRowOverride : pairedRow(u);
      if (pRow != null) {
        const pairInfo = document.createElement("div");
        pairInfo.className = "suggest-popup-pair";
        pairInfo.appendChild(document.createTextNode(pairLabelFor(u, isOpenSide)));
        const pairLink = document.createElement("span");
        pairLink.className = "suggest-popup-pair-link";
        pairLink.textContent = String(pRow + 1);
        pairLink.addEventListener("click", () => scrollRowIntoView(pRow));
        pairInfo.appendChild(pairLink);
        popup.appendChild(pairInfo);
      }

      outputPopups.appendChild(popup);
      entries.push({ el: popup, tagRect });
    }

    for (const u of workingTags) {
      const isExtra = u.kind === "extra";
      if (!isExtra && u.insertConfidence !== "reliable") continue;
      const selector = isExtra
        ? `.extra-tag-anchor[data-uid="${u.__uid}"]`
        : `.suggested-tag[data-uid="${u.__uid}"]`;
      addPopup(u, output.querySelector(selector), isExtra ? "delete" : "add", undefined, false);

      // Дубликат на открывающей стороне (см. .unclosed-open-anchor/
      // buildDisplayHtml) — единственный случай, где попап стоит на
      // РЕАЛЬНОМ, уже существующем в письме теге (не на предложенном), so
      // здесь именно "Удалить?", а не "Добавить?".
      if (u.kind === "unclosed") {
        const openEl = output.querySelector(`.unclosed-open-anchor[data-uid="${u.__uid}"]`);
        addPopup(u, openEl, "delete", pairedRowForOpenSide(u), true);
      }
    }
    positionSuggestPopups(entries, wrapRect);
  }

  // Текст подписи у "Парный тег" (см. addPopup) — какого именно вида тег
  // мы нашли/не нашли у ДРУГОГО конца этой связки. "Не найден" — когда
  // ЭТОТ попап стоит на РЕАЛЬНОМ, уже существующем в письме теге (сам
  // unclosed на месте открытия, сам extra на месте осиротевшего
  // закрывающего) — второй половины у него в письме действительно нет,
  // мы её только предлагаем. "Найден" — когда ЭТОТ попап, наоборот, сам
  // стоит на ПРЕДЛОЖЕННОМ (ещё не принятом) теге — а вот его пара уже
  // реально есть в письме, мы её и нашли.
  function pairLabelFor(u, isOpenSide) {
    if (u.kind === "unclosed") {
      return isOpenSide ? "Не найден закрывающий тег: " : "Найден открывающий тег: ";
    }
    if (u.kind === "unopened") return "Найден закрывающий тег: ";
    if (u.kind === "extra") return "Не найден открывающий тег: ";
    return "Парный тег: ";
  }

  // Номер строки (0-based, как в lastOpenFlags/lastCloseFlags) "парного"
  // тега для u — или null, если пары нет вовсе, или её строку не удалось
  // найти среди уже отрисованных флажков (см. buildDisplayHtml). Три
  // разных случая:
  // - unopened/extra (см. UnopenedTagInfo.pairId/ExtraTagInfo в
  //   src/formatter.ts) — это ДВЕ РАЗНЫЕ записи workingTags, связанные
  //   общим pairId; у "extra" парная строка — открывающая роль (red-
  //   флажок, см. lastOpenFlags) её "unopened"-половины, у "unopened" —
  //   строка серой вставленной подсказки (close-роль, lastCloseFlags) её
  //   "extra"-половины.
  // - unclosed — это ОДНА-ЕДИНСТВЕННАЯ запись без pairId вовсе, но у неё
  //   самой есть ДВЕ строки: где тег реально открылся (u.line, red-флажок
  //   в lastOpenFlags) и где предполагается вставить закрывающий (строка
  //   ЭТОГО ЖЕ попапа, close-роль). Показываем ссылку на первую — вторая
  //   и так уже прямо здесь, под самим попапом.
  function pairedRow(u) {
    if (u.kind === "unclosed") {
      const flag = lastOpenFlags.find((f) => f.uid === u.__uid);
      return flag ? flag.row : null;
    }
    if (u.pairId == null) return null;
    const paired = workingTags.find((e) => e.pairId === u.pairId && e.__uid !== u.__uid);
    if (!paired) return null;
    const flagList = paired.kind === "extra" ? lastOpenFlags : lastCloseFlags;
    const flag = flagList.find((f) => f.uid === paired.__uid);
    return flag ? flag.row : null;
  }

  // Зеркало pairedRow специально для дубликата попапа на открывающей
  // стороне unclosed (см. renderPopups/.unclosed-open-anchor) — обычный
  // pairedRow(u) для unclosed всегда указывает на строку ОТКРЫТИЯ (это
  // то, что нужно попапу у подсказки), а этому дубликату, наоборот, нужна
  // ссылка на строку подсказки (close-роль, lastCloseFlags) — попап и так
  // уже стоит у открытия.
  function pairedRowForOpenSide(u) {
    const flag = lastCloseFlags.find((f) => f.uid === u.__uid);
    return flag ? flag.row : null;
  }

  // Пользователь подтвердил подсказку: закрывающий тег дописывается
  // ПО-НАСТОЯЩЕМУ, текстом, прямо в lastCleanHtml (тот же индекс строки,
  // что и insertBeforeLine, — так и определён этот параметр в
  // src/formatter.ts, см. UnclosedTagInfo). Это первый и единственный
  // путь в интерфейсе, где мы САМИ дописываем содержимое, а не просто
  // показываем предположение, — только по явному действию пользователя.
  //
  // У остальных ещё не решённых записей, чьи line/insertBeforeLine лежат
  // на этой вставленной строке или ниже, сдвигаем номер на +1 — иначе
  // они будут указывать на строку, которая после вставки уже сдвинулась.
  //
  // Для insertBeforeLine это НЕ простое ">=": несколько подсказок часто
  // вытесняются в ОДНУ и ту же точку (см. buildDisplayHtml — там при
  // равенстве insertBeforeLine они сортируются по убыванию depth, чтобы
  // более вложенный тег закрывался первым, то есть визуально стоял ВЫШЕ).
  // Если подтвердить именно менее вложенную запись из такой пары раньше
  // (например, кликнуть на подсказку снизу вверх), наивный сдвиг "у всех
  // с insertBeforeLine >= сдвигаем" утащит следом и более вложенную,
  // которая должна была остаться на месте, — и порядок на экране
  // перевернётся. Поэтому при равенстве insertBeforeLine сдвигаем только
  // записи НЕ глубже подтверждённой (e.depth <= u.depth) — те, что
  // должны были остаться после неё; более вложенные (e.depth > u.depth)
  // оставляем как есть — они по-прежнему должны рендериться перед только
  // что подтверждённым текстом, а не после.
  // Убирает запись uid из workingTags, а если у неё есть pairId (см.
  // UnopenedTagInfo.pairId/ExtraTagInfo в src/formatter.ts) — заодно и
  // парную запись с ТОЙ ЖЕ стороны: "Добавить?" (вставить пропущенный
  // открывающий тег) и "Удалить?" (убрать осиротевший закрывающий) — два
  // взаимоисключающих способа починить ОДИН и тот же дефект, решение по
  // одной из подсказок снимает предложение и по второй, кому бы из них
  // пользователь ни ответил и что бы ни выбрал (принять или отклонить).
  // Возвращает true, если парная запись действительно нашлась и была
  // убрана вместе с uid — нужно вызывающей стороне, чтобы понять, на
  // сколько увеличить rejectedCount (см. totalFlaggedCount в runFormat —
  // он тоже считает пару как ДВЕ записи, значит и "отклонили" должно
  // считать пару как два отклонения, иначе появится позже логика
  // "почему в TotalFlaggedCount 2, а мы всё отклонили якобы 1 кликом").
  function removeWithPair(uid, pairId) {
    const hadPair = pairId != null && workingTags.some((e) => e.pairId === pairId && e.__uid !== uid);
    workingTags = workingTags.filter((e) => e.__uid !== uid && !(pairId != null && e.pairId === pairId));
    return hadPair;
  }

  function acceptSuggestion(u) {
    const lines = lastCleanHtml.split("\n");
    const tagText = u.kind === "unopened" ? "<" + u.tagName + ">" : "</" + u.tagName + ">";
    const text = "  ".repeat(u.depth) + tagText;
    lines.splice(u.insertBeforeLine, 0, text);
    lastCleanHtml = lines.join("\n");

    removeWithPair(u.__uid, u.pairId);
    for (const e of workingTags) {
      if (e.line !== undefined && e.line >= u.insertBeforeLine) e.line += 1;
      const samePoint = e.insertBeforeLine === u.insertBeforeLine;
      if (e.insertBeforeLine !== undefined && (e.insertBeforeLine > u.insertBeforeLine || (samePoint && e.depth <= u.depth))) {
        e.insertBeforeLine += 1;
      }
    }
    if (workingTags.length === 0) {
      reformatAfterAllResolved();
    } else {
      renderOutput();
    }
  }

  // Пользователь отклонил подсказку: убираем запись целиком, вместе с
  // красным флажком — раз пользователь явно отказался добавлять тег,
  // значит он уверен в своём выборе и это не ошибка, дальше нагонять на
  // этот тег незачем. Серая строка/попап исчезают, соседние строки
  // "схлопываются" на её место сами собой. lastCleanHtml не трогаем:
  // этой строки там никогда и не было, это было только предложение.
  function rejectSuggestion(u) {
    const hadPair = removeWithPair(u.__uid, u.pairId);
    rejectedCount += hadPair ? 2 : 1;
    if (workingTags.length === 0) {
      // reformatAfterAllResolved сбрасывает totalFlaggedCount/rejectedCount
      // и считает диагностику заново — если отклонённый дефект и правда
      // остался в HTML, он найдётся опять и покажется снова (см. коммент
      // у reformatAfterAllResolved). Здесь rejectedCount++выше по факту
      // тут же обнуляется — это нормально, статус всё равно пересчитает
      // updateOutputStatus уже по итогам нового прохода.
      reformatAfterAllResolved();
    } else {
      renderOutput();
    }
  }

  // Пользователь подтвердил, что этот "лишний" закрывающий тег (kind ===
  // "extra", см. ExtraTagInfo в src/formatter.ts) — действительно лишний:
  // убираем его СТРОКУ ЦЕЛИКОМ из lastCleanHtml. В отличие от
  // acceptSuggestion (там текст ДОБАВЛЯЕТСЯ), здесь, наоборот, убирается
  // уже существующая строка — поэтому и сдвиг у остальных записей в
  // обратную сторону (-1, а не +1), и без деления на "тот же
  // insertBeforeLine, но глубже/не глубже" — тут удаляется РОВНО одна
  // строка, а не несколько в одной точке, той путаницы просто неоткуда
  // взяться. Если у записи есть пара (см. removeWithPair) — предложение
  // "Добавить?" на ней тоже снимается: пользователь уже выбрал другой
  // способ починить этот же дефект.
  function acceptDeletion(u) {
    const lines = lastCleanHtml.split("\n");
    lines.splice(u.line, 1);
    lastCleanHtml = lines.join("\n");

    removeWithPair(u.__uid, u.pairId);
    for (const e of workingTags) {
      if (e.line !== undefined && e.line > u.line) e.line -= 1;
      if (e.insertBeforeLine !== undefined && e.insertBeforeLine > u.line) e.insertBeforeLine -= 1;
    }
    if (workingTags.length === 0) {
      reformatAfterAllResolved();
    } else {
      renderOutput();
    }
  }

  // Пользователь решил, что тег НЕ лишний — оставляем строку как есть в
  // lastCleanHtml, просто убираем подсказку/флажок. Симметрично
  // rejectSuggestion: пара (если есть) снимается тоже.
  function rejectDeletion(u) {
    const hadPair = removeWithPair(u.__uid, u.pairId);
    rejectedCount += hadPair ? 2 : 1;
    if (workingTags.length === 0) {
      reformatAfterAllResolved();
    } else {
      renderOutput();
    }
  }

  // Согласование числительного с существительным "тег" (1 тег, 2 тега,
  // 5 тегов, 11 тегов, 21 тег, ...) и с прилагательным "незакрытый"
  // (форма на -ый только при n=1, кроме чисел вида *11 — иначе "-ых").
  function pluralizeTag(n) {
    const mod10 = n % 10;
    const mod100 = n % 100;
    if (mod100 >= 11 && mod100 <= 14) return "тегов";
    if (mod10 === 1) return "тег";
    if (mod10 >= 2 && mod10 <= 4) return "тега";
    return "тегов";
  }
  function unclosedAdjective(n) {
    const mod10 = n % 10;
    const mod100 = n % 100;
    return mod10 === 1 && mod100 !== 11 ? "незакрытый" : "незакрытых";
  }
  // То же самое склонение, что и unclosedAdjective ("-ый"/"-ых" по тем же
  // правилам), но для другого прилагательного — "неоткрытый" (не хватает
  // родителя-обёртки, см. checkUnopenedChild в src/formatter.ts).
  function unopenedAdjective(n) {
    const mod10 = n % 10;
    const mod100 = n % 100;
    return mod10 === 1 && mod100 !== 11 ? "неоткрытый" : "неоткрытых";
  }
  // "Лишний"/"лишних" — то же правило (-ий/-их вместо -ый/-ых, но та же
  // логика единственного числа при n===1, кроме *11) — для kind==="extra"
  // (осиротевший закрывающий тег без пары, см. ExtraTagInfo).
  function extraAdjective(n) {
    const mod10 = n % 10;
    const mod100 = n % 100;
    return mod10 === 1 && mod100 !== 11 ? "лишний" : "лишних";
  }

  // Сводка справа от заголовка "Результат": сколько тегов сейчас реально
  // помечены красным флажком (workingTags.length — уменьшается и при
  // принятии, и при отклонении подсказки), плюс отдельно — сколько из
  // них пользователь осознанно отклонил (rejectedCount, только он растёт
  // от rejectSuggestion, отдельно от общего количества). Если проверка
  // выключена чекбоксом — ничего не показываем: мы её не проводили.
  //
  // Особый случай: если проблемных тегов вообще не осталось (openCount
  // === 0), но это получилось ТОЛЬКО за счёт того, что пользователь
  // отклонил вообще все подсказки подряд (rejectedCount === изначальному
  // количеству, ни одна не была принята по-настоящему) — это НЕ то же
  // самое, что "сбалансировано": теги как были не в порядке в исходнике,
  // так и остались, мы просто перестали про них напоминать. Показываем
  // это отдельным красным сообщением, а не зелёным "сбалансированы".
  //
  // workingTags — общий список ВСЕХ трёх видов диагностики (kind:
  // "unclosed" | "unopened" | "extra", см. runFormat) — считаем их
  // раздельными числительными ("N незакрытых, M неоткрытых, K лишних"),
  // а не одной обезличенной суммой: конкретика важнее краткости, а
  // составить фразу из трёх частей не сложнее, чем из двух.
  function updateOutputStatus() {
    if (!checkUnclosedTags.checked || outputEditedManually) {
      outputStatus.textContent = "";
      outputStatus.className = "status-plate";
      return;
    }
    const openCount = workingTags.length;
    const unclosedCount = workingTags.filter((e) => e.kind === "unclosed").length;
    // Спаренный "неоткрытый" (kind==="unopened" с pairId) — это то же
    // самое, что и его пара в "лишних" (см. checkUnopenedChild/pairId в
    // src/formatter.ts): одна и та же строка-подсказка "Добавить?" всё
    // ещё показывается (это по-прежнему рабочий способ починить), но в
    // СЧЁТЕ участвует только один раз, под именем "лишний" — нет смысла
    // сообщать об одном и том же дефекте дважды под разными словами.
    // Несвязанный ("сирота") unopened, без пары — считается отдельно,
    // там правда нечего удалять, только добавить недостающий родитель.
    const unopenedCount = workingTags.filter((e) => e.kind === "unopened" && e.pairId == null).length;
    const extraCount = workingTags.filter((e) => e.kind === "extra").length;
    const allRejected =
      openCount === 0 && rejectedCount > 0 && rejectedCount === totalFlaggedCount;
    let text;
    let cls;
    if (openCount > 0) {
      const clauses = [];
      if (unclosedCount > 0) {
        clauses.push(`${unclosedCount} ${unclosedAdjective(unclosedCount)} ${pluralizeTag(unclosedCount)}`);
      }
      if (unopenedCount > 0) {
        clauses.push(`${unopenedCount} ${unopenedAdjective(unopenedCount)} ${pluralizeTag(unopenedCount)}`);
      }
      if (extraCount > 0) {
        clauses.push(`${extraCount} ${extraAdjective(extraCount)} ${pluralizeTag(extraCount)}`);
      }
      text = `Возможно: ${clauses.join(", ")}`;
      cls = "status-alert";
    } else if (allRejected) {
      text = "Возможны проблемы с тегами";
      cls = "status-alert";
    } else {
      text = "Теги сбалансированы";
      cls = "status-ok";
    }
    if (rejectedCount > 0) {
      text += ` (отклонённые - ${rejectedCount})`;
    }
    outputStatus.innerHTML = "";
    outputStatus.className = "status-plate " + cls;
    outputStatus.appendChild(document.createTextNode(text));
    // Список тегов под сводкой — тот же приём, что и у "Пустые атрибуты"
    // (см. renderEmptyAttrsPlate): имя тега, через двоеточие — строки, где
    // он отмечен, номер строки кликабелен. Только КРАСНЫЕ флажки
    // (lastOpenFlags — строка самой проблемы), серые строки-подсказки
    // (lastCloseFlags) в список не попадают — они не место самого
    // дефекта, а лишь предполагаемое место починки, и уже видны как
    // отдельная серая строка прямо в выводе.
    if (openCount > 0) outputStatus.appendChild(buildTagFlagList());
  }

  // Группирует lastOpenFlags по имени тега — [{ tagName, rows }], rows в
  // порядке появления в документе (тот же порядок, что и у lastOpenFlags
  // самого, см. buildDisplayHtml/workingTags).
  function buildTagFlagList() {
    const byTag = new Map();
    for (const f of lastOpenFlags) {
      if (!byTag.has(f.tagName)) byTag.set(f.tagName, []);
      byTag.get(f.tagName).push(f.row);
    }
    const list = document.createElement("ul");
    list.className = "empty-attrs-list";
    for (const [tagName, rows] of byTag) {
      const li = document.createElement("li");
      li.appendChild(document.createTextNode(`<${tagName}>: `));
      rows.forEach((row, i) => {
        if (i > 0) li.appendChild(document.createTextNode(", "));
        const link = document.createElement("span");
        link.className = "empty-attrs-line-link";
        link.textContent = String(row + 1);
        link.addEventListener("click", () => scrollRowIntoView(row));
        li.appendChild(link);
      });
      list.appendChild(li);
    }
    return list;
  }

  // Общий рендер плашки "Пустые атрибуты (...):" — используется и для
  // "надо заполнить" (el/groups/title = emptyAttrsFillStatus/
  // lastEmptyAttrsFill/"надо заполнить", класс status-alert, без кнопки
  // — самим не вывести значение, решение только за человеком), и для
  // "можно удалить" (muted-класс + кнопка "Удалить все", см.
  // deleteAllEmptyAttrs). См. checkEmptyAttrsOwn/categorizeEmptyAttr в
  // src/formatter.ts. Подсветки в самом коде по умолчанию нет — только
  // список "имя атрибута: строки, где встречен", но каждый номер строки
  // кликабелен (см. handleEmptyAttrLineClick) и по клику подскажет,
  // мигнув самим атрибутом прямо в #output.
  function renderEmptyAttrsPlate(el, groups, title, cls, withDeleteButton) {
    if (groups.length === 0) {
      el.textContent = "";
      el.className = "status-plate";
      return;
    }
    el.innerHTML = "";
    el.className = "status-plate " + cls;
    const titleEl = document.createElement("div");
    titleEl.className = "empty-attrs-title";
    titleEl.textContent = title;
    el.appendChild(titleEl);
    const list = document.createElement("ul");
    list.className = "empty-attrs-list";
    for (const group of groups) {
      const li = document.createElement("li");
      li.appendChild(document.createTextNode(`${group.attrName}: `));
      group.lines.forEach((line, i) => {
        if (i > 0) li.appendChild(document.createTextNode(", "));
        const link = document.createElement("span");
        link.className = "empty-attrs-line-link";
        link.textContent = String(line + 1);
        link.addEventListener("click", () => handleEmptyAttrLineClick(group.attrName, line));
        li.appendChild(link);
      });
      list.appendChild(li);
    }
    el.appendChild(list);
    if (withDeleteButton) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "empty-attrs-delete-all";
      btn.textContent = "Удалить все";
      btn.addEventListener("click", deleteAllEmptyAttrs);
      el.appendChild(btn);
    }
  }

  // lastEmptyAttrsFill/Delete обновляются только в applyFormatResult (не
  // трогаются при accept/reject подсказок по тегам — независимая
  // диагностика), но функция вызывается и из renderOutput — чтобы сразу
  // погаснуть, как только пользователь начинает редактировать вывод
  // вручную (см. outputEditedManually).
  function updateEmptyAttrsStatus() {
    const active = checkEmptyAttrs.checked && !outputEditedManually;
    const showFill = active ? lastEmptyAttrsFill : [];
    const showDelete = active ? lastEmptyAttrsDelete : [];
    // Проверка включена, прогон свежий, и ничего не нашлось — явно
    // сообщаем об этом зелёной плашкой (та же роль, что у "Теги
    // сбалансированы" у outputStatus), а не молча оставляем обе плашки
    // пустыми: иначе не отличить "всё чисто" от "проверка выключена".
    if (active && showFill.length === 0 && showDelete.length === 0) {
      emptyAttrsFillStatus.textContent = "Значимых пустых атрибутов нет";
      emptyAttrsFillStatus.className = "status-plate status-ok";
      emptyAttrsDeleteStatus.textContent = "";
      emptyAttrsDeleteStatus.className = "status-plate";
      return;
    }
    renderEmptyAttrsPlate(
      emptyAttrsFillStatus,
      showFill,
      "Пустые атрибуты (надо заполнить):",
      "status-warning",
      false,
    );
    renderEmptyAttrsPlate(
      emptyAttrsDeleteStatus,
      showDelete,
      "Пустые атрибуты (можно удалить):",
      "status-muted",
      true,
    );
  }

  // Пользователь нажал "Удалить все" на плашке "можно удалить" — убирает
  // САМ АТРИБУТ (например, class="") из соответствующих строк
  // lastCleanHtml целиком, не трогая ничего вокруг. На каждой затронутой
  // строке могут быть НЕСКОЛЬКО таких атрибутов сразу (например,
  // class="" и style="" у одного тега) — собираем их по строкам и чистим
  // все разом за один проход по этой строке, а не по одному через
  // повторные split/join (иначе пришлось бы отдельно следить за сдвигом
  // индексов внутри строки).
  function deleteAllEmptyAttrs() {
    const byLine = new Map();
    for (const group of lastEmptyAttrsDelete) {
      for (const line of group.lines) {
        if (!byLine.has(line)) byLine.set(line, new Set());
        byLine.get(line).add(group.attrName);
      }
    }
    const lines = lastCleanHtml.split("\n");
    for (const [lineIndex, attrNames] of byLine) {
      let text = lines[lineIndex];
      for (const attrName of attrNames) {
        const re = new RegExp("\\s*\\b" + attrName + "\\b\\s*=\\s*(\"\"|'')", "gi");
        text = text.replace(re, "");
      }
      lines[lineIndex] = text;
    }
    lastCleanHtml = lines.join("\n");
    // Полный повторный прогон форматтера — тот же приём, что и
    // reformatAfterAllResolved у тегов: гарантированно верно
    // пересчитывает и пустые атрибуты (список "можно удалить" должен
    // опустеть), и остальную диагностику по свежему тексту.
    applyFormatResult(lastCleanHtml, false);
  }

  // Общая точка перерисовки #output из текущих lastCleanHtml/workingTags
  // — используется и после форматирования, и после принятия/отклонения
  // подсказки в попапе, и после прямого редактирования в #outputEditor.
  // Позиция скролла сохраняется (сброс к началу при замене innerHTML —
  // стандартное поведение браузера, здесь оно не нужно: пользователь
  // кликает попап/печатает именно там, где сейчас смотрит).
  //
  // outputEditor.value обновляем ТОЛЬКО если он реально отличается от
  // lastCleanHtml — если правка началась С НЕГО (см. его же "input"-
  // listener ниже), на этот момент они УЖЕ совпадают, и присваивание
  // .value заново без необходимости сбросило бы позицию курсора/выделения
  // ровно того типа бага, который отдельно чинили для поля ввода (см.
  // комментарий у normalizeAttrsWhitespace в parser.ts).
  // Строит emptyAttrDomIndex (см. объявление выше) — обходит DOM #output
  // ПОСЛЕ того, как innerHTML уже выставлен, считая перенесённые строки
  // ровно так же, как они попали в саму разметку (join("\n") в
  // buildDisplayHtml), чтобы индекс совпадал с системой координат
  // origToFinalRow/resultLines. Пустой атрибут в подсветке — это всегда
  // пара соседних span.tok-attr + span.tok-val, где textContent значения
  // — буквально "" или '' (см. highlightAttrs).
  function buildEmptyAttrDomIndex() {
    const index = new Map();
    let row = 0;
    function visit(node) {
      if (node.nodeType === Node.TEXT_NODE) {
        for (const ch of node.textContent) if (ch === "\n") row++;
        return;
      }
      if (node.nodeType !== Node.ELEMENT_NODE) return;
      if (node.classList.contains("tok-attr")) {
        const valEl = node.nextElementSibling;
        if (valEl && valEl.classList.contains("tok-val")) {
          const val = valEl.textContent;
          if (val === '""' || val === "''") {
            if (!index.has(row)) index.set(row, new Map());
            const byAttr = index.get(row);
            const attrName = node.textContent;
            if (!byAttr.has(attrName)) byAttr.set(attrName, []);
            byAttr.get(attrName).push({ attrEl: node, valEl });
          }
        }
      }
      for (const child of node.childNodes) visit(child);
    }
    for (const child of output.childNodes) visit(child);
    return index;
  }

  // Клик по номеру строки в плашке "Пустые атрибуты" (см.
  // renderEmptyAttrsPlate) — скроллит #output к найденному атрибуту и
  // дважды мигает им красным. line — номер строки в системе lastCleanHtml
  // (как в group.lines), пересчитывается в реально отображаемую строку
  // через lastOrigToFinalRow (строки-подсказки о недостающих тегах могли
  // сдвинуть нумерацию).
  function handleEmptyAttrLineClick(attrName, line) {
    const row = lastOrigToFinalRow[line];
    if (row === undefined) return;
    const pairs = emptyAttrDomIndex.get(row)?.get(attrName);
    if (!pairs || pairs.length === 0) return;
    scrollElementIntoView(pairs[0].attrEl);
    for (const { attrEl, valEl } of pairs) {
      // Перезапуск анимации, если по той же строке кликнули повторно, пока
      // предыдущее мигание ещё не закончилось: снять класс, форсировать
      // reflow (чтение offsetWidth), навесить заново — иначе браузер просто
      // проигнорирует повторное добавление того же класса.
      attrEl.classList.remove("flash-empty-attr");
      valEl.classList.remove("flash-empty-attr");
      void attrEl.offsetWidth;
      attrEl.classList.add("flash-empty-attr");
      valEl.classList.add("flash-empty-attr");
      setTimeout(() => {
        attrEl.classList.remove("flash-empty-attr");
        valEl.classList.remove("flash-empty-attr");
      }, 2000);
    }
  }

  function renderOutput() {
    const savedTop = outputEditor.scrollTop;
    const savedLeft = outputEditor.scrollLeft;
    const { displayHtml, openFlags, closeFlags, lineCount, origToFinalRow } = buildDisplayHtml(
      lastCleanHtml,
      workingTags,
    );
    output.innerHTML = withTrailingLineMarker(displayHtml);
    if (outputEditor.value !== lastCleanHtml) outputEditor.value = lastCleanHtml;
    // Серые строки-подсказки (см. buildDisplayHtml/insertions) — это
    // РЕАЛЬНЫЕ дополнительные строки в отображении (#output/
    // #outputLineNumbers), которых при этом physически НЕТ в
    // outputEditor.value (сама подсказка ещё не принята). Из-за этого
    // #output/#outputLineNumbers становятся выше (scrollHeight), чем
    // outputEditor — и его собственный максимум скролла НЕ ДОТЯГИВАЕТ до
    // самого низа подсказок: последняя вставленная строка навсегда
    // остаётся недокрученной на высоту этих подсказок. Добавляем
    // outputEditor немного "воздуха" снизу (padding-bottom), чтобы у него
    // хватало лишнего скроллируемого места дотянуться до того же самого
    // низа, что и у #output/#outputLineNumbers.
    //
    // 26px — фиксированное значение, подобранное опытным путём, а не
    // точный расчёт "по одной высоте строки на подсказку" (как было
    // раньше, calc(16px + N × lineHeight)). Тот точный расчёт при
    // большом N (несколько подсказок разом) провоцировал в браузере
    // эффект "резиновой" сверхпрокрутки (overscroll bounce) — скролл на
    // мгновение уезжал НИЖЕ реального максимума и потом отскакивал
    // обратно, из-за чего разметка визуально "съезжала" на время
    // анимации. Фиксированные 26px этого не вызывают и на практике
    // хватает, чтобы дотянуться до низа последней подсказки, — решение
    // не идеально строгое, но воспроизводимо чинит баг.
    const realLineCount = lastCleanHtml ? lastCleanHtml.split("\n").length : 1;
    const insertedCount = Math.max(0, lineCount - realLineCount);
    outputEditor.style.paddingBottom = insertedCount > 0 ? "26px" : "";
    outputEditor.scrollTop = savedTop;
    outputEditor.scrollLeft = savedLeft;
    output.scrollTop = savedTop;
    output.scrollLeft = savedLeft;
    outputLineNumbers.scrollTop = savedTop;
    // См. syncInputScroll/setOutputScrollTop про тот же приём.
    void output.offsetHeight;
    void outputLineNumbers.offsetHeight;
    lastOpenFlags = openFlags;
    lastCloseFlags = closeFlags;
    lastOrigToFinalRow = origToFinalRow;
    emptyAttrDomIndex = buildEmptyAttrDomIndex();
    // Флажки — часть содержимого колонки номеров (см. renderOutputLineNumbers),
    // так что перерисовываются вместе с ней, а не отдельным слоем поверх.
    renderOutputLineNumbers(lineCount);
    renderPopups();
    updateScrollHints();
    updateOutputStatus();
    updateEmptyAttrsStatus();
    updateOutputEditableState();
  }

  // Пока есть хоть один неразрешённый тег (workingTags не пуст) —
  // редактирование #outputEditor запрещено целиком (см. подробный
  // комментарий у .output-editor.locked в CSS: "призрачные" строки-
  // подсказки физически не существуют в его собственном value, и правка
  // вперемешку с ними ломает и разметку, и синхронизацию скролла).
  // readOnly — подстраховка на случай, если фокус всё же попадёт в поле
  // (например, через Tab) до того, как сработает обработчик focus ниже;
  // класс .locked только меняет курсор — само реальное блокирование
  // клика/фокуса делают mousedown/focus-обработчики (см. ниже), они же
  // показывают подсказку.
  function updateOutputEditableState() {
    const locked = workingTags.length > 0;
    outputEditor.readOnly = locked;
    outputEditor.classList.toggle("locked", locked);
  }

  let lockedTooltipTimer = null;

  // Позиционируем от того же элемента (.output-clip), что и попапы "Добавить?"
  // (см. wrapRect в renderPopups) — единая система координат для всего, что
  // лежит поверх #output.
  function showLockedTooltip(clientX, clientY) {
    const wrapRect = output.parentElement.getBoundingClientRect();
    lockedTooltip.textContent = "Обязательно сбалансируйте теги";
    lockedTooltip.style.left = clientX - wrapRect.left + 10 + "px";
    lockedTooltip.style.top = clientY - wrapRect.top - 30 + "px";
    lockedTooltip.classList.add("visible");
    clearTimeout(lockedTooltipTimer);
    lockedTooltipTimer = setTimeout(() => lockedTooltip.classList.remove("visible"), 3000);
  }

  // preventDefault на mousedown — стандартный приём, чтобы textarea НЕ
  // получила фокус и курсор вообще не появился (обычный readOnly сам по
  // себе фокус и позиционирование курсора не блокирует, только запрещает
  // менять текст). focus-обработчик — подстраховка на случай фокуса не
  // через клик (например, Tab с предыдущего элемента).
  outputEditor.addEventListener("mousedown", (e) => {
    if (workingTags.length === 0) return;
    e.preventDefault();
    showLockedTooltip(e.clientX, e.clientY);
  });
  outputEditor.addEventListener("focus", () => {
    if (workingTags.length > 0) outputEditor.blur();
  });

  // Общая часть runFormat/reformatAfterAllResolved — прогоняет source
  // через сам форматтер и раскладывает результат по lastCleanHtml/
  // workingTags. scrollToBottom — только для форматирования "с нуля" (по
  // кнопке/чекбоксам): переход к свежему коду ожидаем. Для повторного
  // прохода после разбора всех подсказок (см. reformatAfterAllResolved)
  // пользователь уже смотрит в нужное место — прыгать вниз незачем,
  // позицию скролла сохраняет сам renderOutput.
  function applyFormatResult(source, scrollToBottom) {
    status.textContent = "";
    rejectedCount = 0;
    totalFlaggedCount = 0;
    outputEditedManually = false;
    lastEmptyAttrsFill = [];
    lastEmptyAttrsDelete = [];
    if (!source.trim()) {
      lastCleanHtml = "";
      workingTags = [];
      renderOutput();
      return;
    }
    try {
      const {
        html,
        unclosedTags,
        unopenedTags,
        extraTags,
        emptyAttrsToFill,
        emptyAttrsToDelete,
      } = window.HtmlFormatter.formatHtmlWithDiagnostics(source, {
        collapseOutlookComments: collapseOutlookComments.checked,
        typografy: typografy.checked,
        cleanServiceAttrs: cleanServiceAttrs.checked,
      });
      lastCleanHtml = html;
      lastEmptyAttrsFill = emptyAttrsToFill;
      lastEmptyAttrsDelete = emptyAttrsToDelete;
      totalFlaggedCount = unclosedTags.length + unopenedTags.length + extraTags.length;
      // При выключенной опции просто не показываем ни одной подсказки —
      // сам formatHtmlWithDiagnostics всё равно считает диагностику (это
      // недорого), но веб-интерфейс полностью игнорирует результат: ни
      // флажков, ни попапов, ни серых строк-подсказок.
      //
      // Все три вида диагностики сведены в один workingTags (различаются
      // полем kind — см. buildDisplayHtml/makeFlag/acceptSuggestion) —
      // это и есть то самое "включение в механику проверки незакрытых
      // тегов", о котором просили: один чекбокс, один общий список
      // флажков/попапов, только текст подсказки и (для unclosed/unopened)
      // вставляемый тег разные. Для unopenedTags добавляем
      // line = insertBeforeLine (у самого диагностируемого узла нет
      // отдельной "своей" строки, в отличие от unclosed — см.
      // checkUnopenedChild: там insertBeforeLine и есть строка первого
      // "осиротевшего" ребёнка) и insertConfidence — "reliable" всегда,
      // потому что неоднозначные случаи уже отфильтрованы на уровне
      // leakStack в самом форматтере. pairId (см. UnopenedTagInfo/
      // ExtraTagInfo в src/formatter.ts) переносим как есть — по нему
      // acceptSuggestion/rejectSuggestion/acceptDeletion/rejectDeletion
      // находят и снимают парную подсказку.
      workingTags = checkUnclosedTags.checked
        ? [
            ...unclosedTags.map((u) => Object.assign({ __uid: uidCounter++, kind: "unclosed" }, u)),
            ...unopenedTags.map((u) =>
              Object.assign(
                { __uid: uidCounter++, kind: "unopened", line: u.insertBeforeLine, insertConfidence: "reliable" },
                u,
              ),
            ),
            ...extraTags.map((u) => Object.assign({ __uid: uidCounter++, kind: "extra" }, u)),
          ]
        : [];
      renderOutput();
      if (scrollToBottom) {
        // После свежего форматирования скроллим к самому низу нового кода
        // (уже устоявшееся поведение) — это единственное место, где
        // renderOutput не должен сохранять прежнюю позицию скролла.
        setOutputScrollTop(outputEditor.scrollHeight);
        updateScrollHints();
        renderPopups();
      }
    } catch (err) {
      status.textContent = "Ошибка: " + (err && err.message ? err.message : String(err));
    }
  }

  function runFormat() {
    enforceNoEdgeBlankLines();
    applyFormatResult(input.value, true);
  }

  // Пользователь разобрал ВСЕ подсказки текущего прогона (каждую либо
  // подтвердил, либо отклонил — см. acceptSuggestion/rejectSuggestion).
  // Строчечная вставка/сдвиг номеров строк там — расчёт "на глаз", без
  // полного повторного разбора дерева; как только решать больше нечего,
  // прогоняем накопленный lastCleanHtml через форматтер ещё раз с нуля —
  // это даёт настоящий, а не приближённый отступ по всему документу и
  // заодно вскрывает проблемы, которые могли обнаружиться только ПОСЛЕ
  // принятия предыдущих подсказок (например, вложенный дальше тег, чей
  // родитель появился только что).
  //
  // Важно: если пользователь отклонил подсказку, сам HTML не менялся —
  // значит, при повторном разборе тот же дефект будет найден заново, и
  // соответствующий флажок/попап появится снова. Это осознанное
  // поведение, а не забытая утечка "не спрашивать повторно": "не
  // спрашивать" гарантируется только в рамках уже показанного набора
  // подсказок, а не навсегда — сам документ как был не в порядке в этом
  // месте, так и остался.
  function reformatAfterAllResolved() {
    applyFormatResult(lastCleanHtml, false);
  }

  // Чекбоксы больше НЕ запускают форматирование сами по себе — щелчок
  // только меняет настройку для СЛЕДУЮЩЕГО запуска (runFormat читает их
  // .checked в момент вызова). Старый результат в #output остаётся как
  // есть, пока пользователь явно не нажмёт "Форматировать" (или
  // Cmd/Ctrl+Enter) снова.
  formatBtn.addEventListener("click", runFormat);

  // Прямое редактирование в поле вывода (см. .output-editor в CSS) —
  // тот же приём, что и у поля ввода: пользователь печатает в прозрачный
  // textarea поверх подсвеченного #output, а мы читаем его .value как
  // новый lastCleanHtml. Все текущие подсказки (workingTags) при этом
  // сбрасываются — их позиции (номера строк) считаны для СТАРОГО текста
  // и после ручной правки уже ничего не гарантируют; просто перестаём
  // предлагать и молчим в статус-плашке (см. outputEditedManually в
  // updateOutputStatus), пока пользователь не запустит новый прогон
  // форматтера явно.
  outputEditor.addEventListener("input", () => {
    lastCleanHtml = outputEditor.value;
    workingTags = [];
    rejectedCount = 0;
    totalFlaggedCount = 0;
    outputEditedManually = true;
    renderOutput();
  });
  outputEditor.addEventListener("scroll", () => {
    output.scrollTop = outputEditor.scrollTop;
    output.scrollLeft = outputEditor.scrollLeft;
    outputLineNumbers.scrollTop = outputEditor.scrollTop;
    // См. syncInputScroll про тот же приём.
    void output.offsetHeight;
    void outputLineNumbers.offsetHeight;
    updateScrollHints();
    renderPopups();
  });

  copyBtn.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(lastCleanHtml);
      const old = copyBtn.textContent;
      copyBtn.textContent = "Скопировано";
      setTimeout(() => (copyBtn.textContent = old), 1200);
    } catch {
      status.textContent = "Не удалось скопировать в буфер обмена.";
    }
  });

  input.addEventListener("keydown", (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
      e.preventDefault();
      runFormat();
    }
  });
</script>
</body>
</html>
